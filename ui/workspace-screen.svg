    <rect x="560" y="60" width="100" height="66" rx="5" fill="#fff"/>
    <rect x="668" y="60" width="100" height="66" rx="5" fill="#eaf4ea"/>
    <rect x="776" y="60" width="100" height="66" rx="5" fill="#fff"/>
  </g>
  <g fill="#222">
    <text x="40" y="47">시스템 모니터</text>
    <text x="40" y="82" font-weight="bold">워크스페이스</text>
    <text x="40" y="118" fill="#777" font-size="11">페이로드</text>
    <text x="48" y="140">flight-control</text>
    <text x="48" y="160">siyi · ximea …</text>
    <text x="40" y="192" fill="#777" font-size="11">개발 도구 (제품에 없음)</text>
    <text x="48" y="214">replay</text>
    <text x="236" y="46" font-weight="bold" font-size="14">워크스페이스</text>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="286" y="84" font-weight="bold">개요</text>
    <text x="286" y="102" font-size="11">매니저 요약</text>
    <text x="286" y="116" font-size="11">문제부터</text>
    <text x="394" y="84" font-weight="bold">로그</text>
    <text x="394" y="102" font-size="11">워커·서비스</text>
    <text x="502" y="84" font-weight="bold">명령 이력</text>
    <text x="502" y="102" font-size="11">결과·advisory</text>
    <text x="610" y="84" font-weight="bold">워커 연결</text>
    <text x="610" y="102" font-size="11">누가 누구 출력</text>
    <text x="610" y="116" font-size="11">을 받나</text>
    <text x="718" y="84" font-weight="bold">설정</text>
