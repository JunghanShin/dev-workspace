<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#fff"/>
  <g stroke="#555">
    <rect x="20" y="20" width="180" height="230" rx="6" fill="#f4f6fa"/>
    <rect x="30" y="64" width="160" height="26" rx="4" fill="#e8eef9"/>
    <rect x="220" y="20" width="660" height="120" rx="6" fill="#fafbfd"/>
