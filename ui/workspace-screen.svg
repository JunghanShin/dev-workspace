  <g font-size="11" fill="#444">
    <text x="20" y="268">점선 상자 = 지금 왼쪽 목록에 따로 있는 패널(탭으로 옮기고 없앰) · 주소 #/workspace/&lt;탭&gt; · 열린 탭만 스트림</text>
    <text x="20" y="288">왼쪽 목록: 맨 위 "시스템 모니터"·"워크스페이스", 묶음 "페이로드"(장치 워커 패널·자동 화면), "개발 도구"</text>
    <text x="20" y="308">위 띠: "정상"·"주의"·"이상"(누르면 개요) + "개발"/"제품" 표시, 모드 토글 없음(docs/modes.md)</text>
    <text x="20" y="328">초록 = 이번에 새로 만드는 것(설정을 화면에서 바꿈, install/config/workspace-settings.json + 게이트웨이 PUT /workspace/settings)</text>
  </g>
