    <text x="718" y="116" font-size="11">바로 바꿈</text>
    <text x="826" y="84" font-weight="bold">관리</text>
    <text x="826" y="102" font-size="11">제품 빌드·정보</text>
    <text x="826" y="116" font-size="11">위험 값 읽기만</text>
  </g>
  <g stroke="#999" stroke-dasharray="4 3">
    <rect x="236" y="200" width="100" height="40" rx="5" fill="#fff"/>
    <rect x="344" y="200" width="100" height="40" rx="5" fill="#fff"/>
    <rect x="452" y="200" width="100" height="40" rx="5" fill="#fff"/>
    <rect x="560" y="200" width="100" height="40" rx="5" fill="#fff"/>
    <rect x="668" y="200" width="208" height="40" rx="5" fill="#fff"/>
