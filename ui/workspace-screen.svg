    <line x1="394" y1="200" x2="394" y2="128"/>
    <line x1="502" y1="200" x2="502" y2="128"/>
    <line x1="610" y1="200" x2="610" y2="128"/>
    <line x1="740" y1="200" x2="718" y2="128"/>
    <line x1="804" y1="200" x2="826" y2="128"/>
