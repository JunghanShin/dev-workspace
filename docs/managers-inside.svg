<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>매니저 안 구조</title>
<desc>매니저는 프로세스 하나다. 워커마다 구독 스레드 하나와 크기 제한 큐 하나를 두고, 코어 스레드 하나가 모든 큐에서 꺼내 상태를 혼자 가지고 규칙으로 판단한다. 요청은 명령 소켓으로 받아 코어가 답한다. 코어는 매니저 주제를 발행하고, 워커에 보낼 명령은 명령 큐와 명령 스레드로, 응답은 응답 큐로 돌아온다. 느린 일(예: record의 파일 쓰기)은 쓰기 큐와 쓰기 스레드로 뺀다. mission은 코어 안에 역할마다 명령 대기 큐를 두고, record는 쓰기 큐가 차면 버리고 지표로 남긴다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="960" height="580" fill="#ffffff"/>

<!-- 왼쪽: 보내는 곳 -->
<g font-size="12" text-anchor="middle">
<rect x="20" y="90" width="120" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="80" y="115" fill="#712B13">워커 A 주제</text>
<rect x="20" y="150" width="120" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="80" y="175" fill="#712B13">워커 B 주제</text>
<rect x="20" y="210" width="120" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="80" y="235" fill="#712B13">워커 C 주제</text>
<rect x="20" y="290" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="80" y="315" fill="#3C3489">다른 매니저 주제</text>
<rect x="20" y="350" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="80" y="375" fill="#444441">요청 보낸 곳</text>
</g>

<!-- 매니저 프로세스 -->
<rect x="170" y="30" width="630" height="380" rx="16" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="186" y="52" font-size="13.5" font-weight="500" fill="#3C3489">매니저 프로세스 하나 (C++, libworker 호스트 + 모듈)</text>
<text x="260" y="78" text-anchor="middle" font-size="10.5" fill="#888780">구독 스레드(워커마다, many)</text>

<g font-size="11.5" text-anchor="middle">
<rect x="200" y="90" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="260" y="115" fill="#3C3489">구독 A</text>
<rect x="200" y="150" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="260" y="175" fill="#3C3489">구독 B</text>
<rect x="200" y="210" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="260" y="235" fill="#3C3489">구독 C</text>
<rect x="200" y="290" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="260" y="315" fill="#3C3489">구독(매니저)</text>
<rect x="200" y="350" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="260" y="375" fill="#3C3489">명령 소켓</text>
</g>

<!-- 큐 -->
<g font-size="10.5" text-anchor="middle" fill="#5F5E5A">
<rect x="340" y="98" width="56" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="368" y="114">큐</text>
<rect x="340" y="158" width="56" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="368" y="174">큐</text>
<rect x="340" y="218" width="56" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="368" y="234">큐</text>
<rect x="340" y="298" width="56" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="368" y="314">큐</text>
</g>

<!-- 화살표: 보낸 곳 → 구독 → 큐 → 코어 -->
<g stroke="#993C1D" stroke-width="1.1" fill="none">
<line x1="140" y1="110" x2="198" y2="110" marker-end="url(#a)"/>
<line x1="140" y1="170" x2="198" y2="170" marker-end="url(#a)"/>
<line x1="140" y1="230" x2="198" y2="230" marker-end="url(#a)"/>
</g>
<g stroke="#534AB7" stroke-width="1.1" fill="none">
<line x1="140" y1="310" x2="198" y2="310" marker-end="url(#a)"/>
<line x1="320" y1="110" x2="338" y2="110" marker-end="url(#a)"/>
<line x1="320" y1="170" x2="338" y2="170" marker-end="url(#a)"/>
<line x1="320" y1="230" x2="338" y2="230" marker-end="url(#a)"/>
<line x1="320" y1="310" x2="338" y2="310" marker-end="url(#a)"/>
<line x1="396" y1="110" x2="428" y2="110" marker-end="url(#a)"/>
<line x1="396" y1="170" x2="428" y2="170" marker-end="url(#a)"/>
<line x1="396" y1="230" x2="428" y2="230" marker-end="url(#a)"/>
<line x1="396" y1="310" x2="428" y2="310" marker-end="url(#a)"/>
<line x1="320" y1="370" x2="428" y2="370" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
<line x1="140" y1="370" x2="198" y2="370" stroke="#5F5E5A" stroke-width="1.1" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="374" y="362" text-anchor="middle" font-size="10" fill="#534AB7">요청 · 답</text>

<!-- 코어 -->
<rect x="430" y="90" width="190" height="300" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="525" y="118" text-anchor="middle" font-size="13.5" font-weight="500" fill="#3C3489">코어</text>
<text x="525" y="138" text-anchor="middle" font-size="11" fill="#534AB7">스레드 하나 (호스트 루프)</text>
<g font-size="11" text-anchor="middle" fill="#534AB7">
<text x="525" y="176">큐가 차면 깨어나 꺼냄</text>
<text x="525" y="196">상태를 혼자 가짐(잠금 없음)</text>
<text x="525" y="216">규칙 데이터로 판단</text>
<text x="525" y="236">(엔진은 코드, 규칙은 데이터)</text>
<text x="525" y="276">요청은 여기서 답함</text>
</g>
<text x="525" y="374" text-anchor="middle" font-size="10" fill="#888780">모든 스레드 ThreadWatch 감시</text>

<!-- 오른쪽 안: 출력 -->
<g font-size="10.5" text-anchor="middle" fill="#5F5E5A">
<rect x="640" y="198" width="52" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="666" y="214">명령 큐</text>
<rect x="640" y="248" width="52" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="666" y="264">응답 큐</text>
<rect x="640" y="318" width="52" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="666" y="334">쓰기 큐</text>
</g>
<g font-size="11.5" text-anchor="middle">
<rect x="700" y="100" width="86" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="743" y="117" fill="#3C3489">발행</text><text x="743" y="133" font-size="9.5" fill="#534AB7">매니저 주제</text>
<rect x="704" y="190" width="82" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="745" y="215" fill="#3C3489">명령 스레드</text>
<rect x="704" y="310" width="82" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3"/><text x="745" y="335" fill="#3C3489">쓰기 스레드</text>
</g>
<text x="745" y="366" text-anchor="middle" font-size="10" fill="#888780">느린 일(필요할 때)</text>

<g stroke="#534AB7" stroke-width="1.1" fill="none">
<line x1="620" y1="120" x2="698" y2="120" marker-end="url(#a)"/>
<line x1="620" y1="210" x2="638" y2="210" marker-end="url(#a)"/>
<line x1="692" y1="210" x2="702" y2="210" marker-end="url(#a)"/>
<polyline points="745,230 745,260 694,260" marker-end="url(#a)"/>
<line x1="640" y1="260" x2="622" y2="260" marker-end="url(#a)"/>
<line x1="620" y1="330" x2="638" y2="330" marker-end="url(#a)"/>
<line x1="692" y1="330" x2="702" y2="330" marker-end="url(#a)"/>
</g>

<!-- 바깥 오른쪽 -->
<g font-size="11.5" text-anchor="middle">
<rect x="826" y="94" width="120" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="886" y="116" fill="#444441">구독자</text><text x="886" y="134" font-size="10" fill="#5F5E5A">매니저 · 게이트웨이</text>
<rect x="826" y="190" width="120" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="886" y="215" fill="#712B13">워커 명령 소켓</text>
<rect x="826" y="310" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="886" y="335" fill="#444441">디스크</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.1" fill="none">
<line x1="786" y1="120" x2="824" y2="120" marker-end="url(#a)"/>
<line x1="786" y1="210" x2="824" y2="210" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="786" y1="330" x2="824" y2="330" marker-end="url(#a)"/>
</g>

<!-- 매니저마다 다른 곳 -->
<rect x="170" y="432" width="310" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="186" y="456" font-size="12.5" font-weight="500" fill="#3C3489">mission-manager: 코어 안 역할별 명령 대기 큐</text>
<g font-size="11" fill="#534AB7">
<text x="186" y="480">역할마다 큐 하나, 한 번에 명령 하나만 보냄</text>
<text x="186" y="499">응답(또는 시간 초과)이 오면 다음 명령</text>
<text x="186" y="518">큐가 차면 busy로 거절 = 동시에 온 명령 정리</text>
</g>
<rect x="490" y="432" width="310" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="506" y="456" font-size="12.5" font-weight="500" fill="#3C3489">record-manager: 쓰기 큐 → 쓰기 스레드</text>
<g font-size="11" fill="#534AB7">
<text x="506" y="480">디스크가 느려도 구독 · 코어는 계속 돎</text>
<text x="506" y="499">큐가 차면 그 기록만 버리고 버린 수를 지표로</text>
<text x="506" y="518">파일 나누기 · 오래된 것 지우기도 쓰기 스레드</text>
</g>
<text x="485" y="568" text-anchor="middle" font-size="10.5" fill="#888780">큐는 모두 크기 제한 · 워커 하나가 느리거나 끊겨도 그 큐만 참 · 코어가 모든 스레드가 살아 있을 때만 heartbeat</text>
</svg>
