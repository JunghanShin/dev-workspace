<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>워크스페이스 계층 구조</title>
<desc>화면과 외부 운용은 게이트웨이로만 들어온다. 게이트웨이는 신분 확인, 전달, 기록만 하고 판단은 매니저 층이 한다. 매니저는 추상화 층(계약과 연결 선언)을 통해서만 장치·처리 워커에 명령하고 결과를 구독한다. 워커는 일하고 결과만 낸다. process-manager는 매니저와 워커 프로세스를 띄우고 감시한다. 빠른 제어 고리는 매니저가 켜고, 켜진 동안 정해진 두 워커가 직접 주고받는다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="900" height="730" fill="#ffffff"/>

<!-- 바깥 손님 -->
<rect x="150" y="20" width="260" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="280" y="41" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">화면 (별도 담당)</text>
<text x="280" y="59" text-anchor="middle" font-size="11.5" fill="#5F5E5A">계약(정의 파일)만 보고 그림</text>
<rect x="490" y="20" width="260" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="620" y="41" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">외부 운용 (지상국 등)</text>
<text x="620" y="59" text-anchor="middle" font-size="11.5" fill="#5F5E5A">화면과 같은 손님 하나</text>

<!-- 게이트웨이 -->
<rect x="150" y="110" width="600" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="450" y="131" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">게이트웨이 (지금 REST를 키움)</text>
<text x="450" y="149" text-anchor="middle" font-size="11.5" fill="#534AB7">신분 확인 · 매니저로 전달 · 명령 기록 · 운용/정비 모드 표시. 판단하지 않음</text>

<!-- 매니저 층 -->
<rect x="40" y="200" width="710" height="150" rx="14" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="56" y="222" font-size="14" font-weight="500" fill="#085041">매니저 층 (각각 프로세스, 판단은 여기서)</text>
<rect x="55" y="235" width="105" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="107" y="258" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">config-manager</text>
<text x="107" y="280" text-anchor="middle" font-size="11" fill="#0F6E56">설정 · 프로파일</text>
<text x="107" y="297" text-anchor="middle" font-size="11" fill="#0F6E56">사용자 · 키</text>
<text x="107" y="314" text-anchor="middle" font-size="11" fill="#0F6E56">버전 · 백업</text>
<rect x="170" y="235" width="105" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="222" y="258" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">status-manager</text>
<text x="222" y="280" text-anchor="middle" font-size="11" fill="#0F6E56">상태 종합</text>
<text x="222" y="297" text-anchor="middle" font-size="11" fill="#0F6E56">(보기만)</text>
<text x="222" y="314" text-anchor="middle" font-size="11" fill="#0F6E56">링크 · 시각 기준</text>
<rect x="285" y="235" width="105" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="337" y="258" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">fault-manager</text>
<text x="337" y="280" text-anchor="middle" font-size="11" fill="#0F6E56">이상 판단</text>
<text x="337" y="297" text-anchor="middle" font-size="11" fill="#0F6E56">심각도 · 비상 명령</text>
<text x="337" y="314" text-anchor="middle" font-size="11" fill="#0F6E56">(홀로도 돎)</text>
<rect x="400" y="235" width="105" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="452" y="258" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">record-manager</text>
<text x="452" y="280" text-anchor="middle" font-size="11" fill="#0F6E56">기록 · 저장</text>
<text x="452" y="297" text-anchor="middle" font-size="11" fill="#0F6E56">검색</text>
<text x="452" y="314" text-anchor="middle" font-size="11" fill="#0F6E56">장시간 분석</text>
<rect x="515" y="235" width="105" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="567" y="258" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">mission-manager</text>
<text x="567" y="280" text-anchor="middle" font-size="11" fill="#0F6E56">임무 · 경로</text>
<text x="567" y="297" text-anchor="middle" font-size="11" fill="#0F6E56">명령 권한</text>
<text x="567" y="314" text-anchor="middle" font-size="11" fill="#0F6E56">모드 허가</text>
<rect x="630" y="235" width="105" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="682" y="258" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">payload-manager</text>
<text x="682" y="280" text-anchor="middle" font-size="11" fill="#0F6E56">카메라 · 짐벌</text>
<text x="682" y="297" text-anchor="middle" font-size="11" fill="#0F6E56">인식 · 추적</text>
<text x="682" y="314" text-anchor="middle" font-size="11" fill="#0F6E56">운용</text>

<!-- 추상화 층 -->
<rect x="40" y="390" width="710" height="46" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="395" y="410" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">추상화 층: 계약(정의 파일: 명령 · 상태 · 주제 · 오류) + 연결 선언</text>
<text x="395" y="427" text-anchor="middle" font-size="11.5" fill="#5F5E5A">서로 이름을 모름. 정의가 같으면 갈아 끼움, 연결 선언으로 잇고 끊음</text>

<!-- 워커 층 -->
<rect x="40" y="476" width="710" height="110" rx="14" fill="none" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="56" y="498" font-size="14" font-weight="500" fill="#712B13">장치 · 처리 워커 (일하고 결과만 냄, 판단 안 함)</text>
<rect x="55" y="508" width="160" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="135" y="534" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">비행 제어 워커</text>
<text x="135" y="553" text-anchor="middle" font-size="11" fill="#993C1D">비행 컨트롤러와 대화</text>
<rect x="228" y="508" width="160" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="308" y="534" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">카메라 · 짐벌 워커</text>
<text x="308" y="553" text-anchor="middle" font-size="11" fill="#993C1D">장비 제어 · 영상</text>
<rect x="401" y="508" width="160" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="481" y="534" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">영상 인식 워커</text>
<text x="481" y="553" text-anchor="middle" font-size="11" fill="#993C1D">인식 · ID 추적</text>
<rect x="574" y="508" width="160" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="654" y="534" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">그 밖의 워커</text>
<text x="654" y="553" text-anchor="middle" font-size="11" fill="#993C1D">센서 · 통신 장비 …</text>

<!-- 장치 -->
<rect x="40" y="616" width="710" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="395" y="641" text-anchor="middle" font-size="12.5" fill="#444441">장치: 비행 컨트롤러 · 카메라 · 짐벌 · 센서 · 통신 장비</text>

<!-- process-manager -->
<rect x="780" y="200" width="100" height="386" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="830" y="372" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">process-</text>
<text x="830" y="389" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">manager</text>
<text x="830" y="411" text-anchor="middle" font-size="11" fill="#854F0B">프로세스</text>
<text x="830" y="427" text-anchor="middle" font-size="11" fill="#854F0B">실행 · 감시</text>
<text x="830" y="443" text-anchor="middle" font-size="11" fill="#854F0B">(지금 Manager)</text>

<!-- 화살표: 명령(아래로) · 상태(위로) -->
<g fill="none" stroke="#444441" stroke-width="1.2">
<line x1="250" y1="70" x2="250" y2="110" marker-end="url(#a)"/>
<line x1="310" y1="110" x2="310" y2="70" marker-end="url(#a)"/>
<line x1="590" y1="70" x2="590" y2="110" marker-end="url(#a)"/>
<line x1="650" y1="110" x2="650" y2="70" marker-end="url(#a)"/>
<line x1="400" y1="160" x2="400" y2="200" marker-end="url(#a)"/>
<line x1="500" y1="200" x2="500" y2="160" marker-end="url(#a)"/>
<line x1="300" y1="350" x2="300" y2="390" marker-end="url(#a)"/>
<line x1="600" y1="390" x2="600" y2="350" marker-end="url(#a)"/>
<line x1="300" y1="436" x2="300" y2="476" marker-end="url(#a)"/>
<line x1="600" y1="476" x2="600" y2="436" marker-end="url(#a)"/>
<line x1="395" y1="586" x2="395" y2="616" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
<g font-size="11" fill="#5F5E5A">
<text x="242" y="94" text-anchor="end">명령</text><text x="318" y="94">상태</text>
<text x="582" y="94" text-anchor="end">명령</text><text x="658" y="94">상태</text>
<text x="392" y="184" text-anchor="end">명령</text><text x="508" y="184">상태</text>
<text x="292" y="374" text-anchor="end">명령</text><text x="608" y="374">결과 구독</text>
<text x="292" y="460" text-anchor="end">명령</text><text x="608" y="460">결과(주제 · 데이터)</text>
</g>
<!-- process-manager → 매니저 층 · 워커 층 -->
<g fill="none" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 3">
<line x1="780" y1="275" x2="750" y2="275" marker-end="url(#a)"/>
<line x1="780" y1="531" x2="750" y2="531" marker-end="url(#a)"/>
</g>
<!-- 빠른 제어 고리 -->
<path d="M481 572 L481 581 L308 581 L308 572" fill="none" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>

<!-- 범례 -->
<g font-size="11.5" fill="#444441">
<line x1="40" y1="690" x2="70" y2="690" stroke="#444441" stroke-width="1.2"/>
<text x="78" y="694">명령 · 상태 (항상 위층 → 아래층으로 명령, 아래층 → 위층으로 결과)</text>
<line x1="40" y1="712" x2="70" y2="712" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="78" y="716">빠른 제어 고리: 매니저가 켜고 끔, 켜진 동안만 두 워커가 직접(예: 인식 → 짐벌 추적)</text>
<line x1="560" y1="690" x2="590" y2="690" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="598" y="694">프로세스 띄우기 · 감시</text>
</g>
</svg>
