<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#fff"/>
  <g stroke="#555">
    <rect x="20" y="130" width="140" height="60" rx="6" fill="#f4f6fa"/>
    <rect x="210" y="40" width="660" height="230" rx="8" fill="#fafbfd"/>
    <rect x="230" y="70" width="200" height="56" rx="6" fill="#fff8e6"/>
    <rect x="230" y="150" width="200" height="90" rx="6" fill="#e8eef9"/>
    <rect x="480" y="150" width="160" height="60" rx="6" fill="#eaf4ea"/>
    <rect x="690" y="70" width="160" height="70" rx="6" fill="#fde8e8"/>
    <rect x="690" y="170" width="160" height="70" rx="6" fill="#f4f6fa"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="90" y="156" font-weight="bold">상대 워커</text>
    <text x="90" y="176">스트림(주제)</text>
    <text x="540" y="60" fill="#666">받는 워커(libworker 0.17)</text>
    <text x="330" y="92" font-weight="bold">① 표(시작할 때)</text>
    <text x="330" y="112">uses 사본 스키마: 상대 → 주제</text>
    <text x="330" y="172" font-weight="bold">Subscriber 스레드</text>
    <text x="330" y="194">② 주제마다 1 s에 한 번</text>
    <text x="330" y="214">스키마로 검사</text>
    <text x="330" y="232" fill="#666">데이터는 그대로</text>
    <text x="560" y="176" font-weight="bold">모듈</text>
    <text x="560" y="196">받은 값 그대로 씀</text>
    <text x="770" y="94" font-weight="bold">③ 틀리면</text>
    <text x="770" y="114">bad 셈 · 마지막 이유</text>
    <text x="770" y="132">input_mismatch(60 s에 한 번)</text>
    <text x="770" y="194" font-weight="bold">④ 보이기</text>
    <text x="770" y="214">get_status input_check</text>
    <text x="770" y="232">지표 inputs_&lt;입력&gt;_bad</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="160" y1="170" x2="228" y2="190"/>
    <line x1="330" y1="126" x2="330" y2="148"/>
    <line x1="430" y1="180" x2="478" y2="180"/>
    <line x1="430" y1="155" x2="688" y2="100"/>
    <line x1="770" y1="140" x2="770" y2="168"/>
  </g>
  <g font-size="11" fill="#444">
    <text x="20" y="300">막지 않고 알리기만 · 계약이 없거나(단독 실행) 사본에 스키마가 없으면 아무것도 안 함 · 끄기: 호스트 키 input_check "off"</text>
    <text x="20" y="320">스키마 규칙은 출력 대조(dev/io_contract.py)와 같음: 내보내는 쪽은 시험 때, 받는 쪽은 실행 중</text>
  </g>
</svg>
