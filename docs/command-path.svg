<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>명령 길: 검사 세 곳</title>
<desc>화면과 원격 화면은 게이트웨이를 거치며 모드와 사용자 역할로 검사받고 보낸 곳이 붙는다. 외부 연동 워커는 워커 명령 소켓에 직접 명령하고 Manager API로 process-manager에 요청한다. 워커 명령 소켓은 process-manager가 만든 peers.json으로 보낸 프로세스를 검사한다. 외부 도구는 중계를 거쳐 장치로 바로 가서 워크스페이스 밖이다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="940" height="650" fill="#ffffff"/>

<!-- 보드(워크스페이스) -->
<rect x="250" y="20" width="680" height="420" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="266" y="40" font-size="11.5" fill="#888780">보드 (워크스페이스)</text>

<!-- 바깥: 화면·원격 -->
<rect x="20" y="50" width="200" height="90" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="120" y="74" text-anchor="middle" font-size="13.5" font-weight="500" fill="#444441">화면 · 원격 화면</text>
<text x="120" y="96" text-anchor="middle" font-size="11.5" fill="#5F5E5A">브라우저(로그인) → screen</text>
<text x="120" y="114" text-anchor="middle" font-size="11.5" fill="#5F5E5A">토큰(원격 화면) → remote:이름</text>

<!-- 바깥: 외부 장비 -->
<rect x="20" y="240" width="200" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="120" y="264" text-anchor="middle" font-size="13.5" font-weight="500" fill="#444441">외부 장비</text>
<text x="120" y="284" text-anchor="middle" font-size="11.5" fill="#5F5E5A">외부 운용 프로토콜</text>

<!-- 게이트웨이 ① -->
<rect x="270" y="50" width="210" height="120" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="375" y="74" text-anchor="middle" font-size="13.5" font-weight="500" fill="#085041">① nginx → 게이트웨이</text>
<text x="375" y="98" text-anchor="middle" font-size="11.5" fill="#0F6E56">모드 × 사용자 역할 × 명령 종류</text>
<text x="375" y="116" text-anchor="middle" font-size="11.5" fill="#0F6E56">종류는 워커 계약(io/)으로</text>
<text x="375" y="134" text-anchor="middle" font-size="11.5" fill="#0F6E56">넘길 때 from을 붙임</text>
<text x="375" y="156" text-anchor="middle" font-size="10.5" fill="#888780">막으면 403 need: development</text>

<!-- 외부 연동 워커 -->
<rect x="270" y="230" width="210" height="80" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="375" y="254" text-anchor="middle" font-size="13.5" font-weight="500" fill="#444441">외부 연동 워커</text>
<text x="375" y="276" text-anchor="middle" font-size="11.5" fill="#5F5E5A">manager_api 워커(6.5)</text>
<text x="375" y="294" text-anchor="middle" font-size="11.5" fill="#5F5E5A">from = 워커 id</text>

<!-- process-manager ③ -->
<rect x="520" y="300" width="210" height="120" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="625" y="324" text-anchor="middle" font-size="13.5" font-weight="500" fill="#3C3489">③ process-manager</text>
<text x="625" y="348" text-anchor="middle" font-size="11.5" fill="#534AB7">Manager API 쓰기 × 모드</text>
<text x="625" y="366" text-anchor="middle" font-size="11.5" fill="#534AB7">commanders + 계약 + 모드</text>
<text x="625" y="384" text-anchor="middle" font-size="11.5" fill="#534AB7">→ run/peers.json</text>
<text x="625" y="406" text-anchor="middle" font-size="10.5" fill="#888780">게이트웨이 pid·모드: manager-rest.sock</text>

<!-- 워커 명령 소켓 ② -->
<rect x="770" y="70" width="150" height="300" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="845" y="94" text-anchor="middle" font-size="13.5" font-weight="500" fill="#085041">② 워커</text>
<text x="845" y="112" text-anchor="middle" font-size="13.5" font-weight="500" fill="#085041">명령 소켓</text>
<text x="845" y="138" text-anchor="middle" font-size="11.5" fill="#0F6E56">(libworker)</text>
<text x="845" y="168" text-anchor="middle" font-size="11.5" fill="#0F6E56">상대 pid(커널)</text>
<text x="845" y="186" text-anchor="middle" font-size="11.5" fill="#0F6E56">→ peers.json에서</text>
<text x="845" y="204" text-anchor="middle" font-size="11.5" fill="#0F6E56">누구인지 · 허용 명령</text>
<text x="845" y="232" text-anchor="middle" font-size="11.5" fill="#0F6E56">읽기는 늘 통과</text>
<text x="845" y="258" text-anchor="middle" font-size="11.5" fill="#0F6E56">warn: 기록만</text>
<text x="845" y="276" text-anchor="middle" font-size="11.5" fill="#0F6E56">enforce: 거절</text>
<text x="845" y="304" text-anchor="middle" font-size="11.5" fill="#0F6E56">last_command</text>
<text x="845" y="322" text-anchor="middle" font-size="11.5" fill="#0F6E56">(명령 · from)</text>
<text x="845" y="350" text-anchor="middle" font-size="10.5" fill="#888780">단독 실행이면 안 봄</text>

<!-- 바깥: 외부 도구 (워크스페이스 밖) -->
<rect x="20" y="470" width="200" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="120" y="500" text-anchor="middle" font-size="13.5" font-weight="500" fill="#444441">외부 도구</text>
<rect x="270" y="470" width="210" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="375" y="500" text-anchor="middle" font-size="13.5" font-weight="500" fill="#444441">외부 중계</text>
<rect x="520" y="470" width="210" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="625" y="492" text-anchor="middle" font-size="13.5" font-weight="500" fill="#444441">장치</text>
<text x="625" y="510" text-anchor="middle" font-size="10.5" fill="#888780">워크스페이스 밖 · 결과만 external</text>

<!-- 화살표 -->
<line x1="220" y1="95" x2="268" y2="95" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="480" y1="100" x2="768" y2="100" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="220" y1="270" x2="268" y2="270" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="480" y1="260" x2="768" y2="260" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M375 310 L375 350 L518 350" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a)"/>
<line x1="730" y1="340" x2="768" y2="340" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#a)"/>
<line x1="220" y1="495" x2="268" y2="495" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="480" y1="495" x2="518" y2="495" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>

<!-- 범례·모드 -->
<text x="20" y="560" font-size="12" font-weight="500" fill="#444441">운용 모드(기본)</text>
<text x="140" y="560" font-size="11.5" fill="#5F5E5A">읽기 · 역할 명령(io/&lt;역할&gt;.json)만. 허용된 곳이면 화면 · 원격 · 외부 연동 워커 모두 같은 규칙</text>
<text x="20" y="584" font-size="12" font-weight="500" fill="#444441">개발 모드</text>
<text x="140" y="584" font-size="11.5" fill="#5F5E5A">+ 워커 전용 명령(io/self.json, 계약에 없는 명령) · 설정 · 시작/정지 · 연결 선언 바꾸기</text>
<text x="20" y="608" font-size="12" font-weight="500" fill="#444441">선</text>
<text x="140" y="608" font-size="11.5" fill="#5F5E5A">실선 = 명령 · 긴 점선 = Manager API 요청 · 짧은 점선 = 허용 목록 파일</text>
<text x="20" y="632" font-size="11.5" fill="#888780">동시 명령은 조정하지 않고 도착 순서대로. 화면은 연결 선언에 적지 않아도 늘 허용. 조정이 필요하면 매니저 규칙으로</text>
</svg>
