<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#fff"/>
  <g stroke="#555">
    <rect x="20" y="40" width="150" height="56" rx="6" fill="#f4f6fa"/>
    <rect x="20" y="170" width="150" height="56" rx="6" fill="#f4f6fa"/>
    <rect x="20" y="300" width="150" height="56" rx="6" fill="#f4f6fa"/>
    <rect x="300" y="40" width="250" height="186" rx="6" fill="#e8eef9"/>
    <rect x="680" y="100" width="200" height="66" rx="6" fill="#eaf4ea"/>
    <rect x="300" y="290" width="250" height="76" rx="6" fill="#fff8e6"/>
    <rect x="680" y="290" width="200" height="76" rx="6" fill="#f4f6fa"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="95" y="63" font-weight="bold">브라우저(바깥)</text>
    <text x="95" y="82">https://보드:8443</text>
    <text x="95" y="193" font-weight="bold">브라우저(바깥)</text>
    <text x="95" y="212">http://보드:8080</text>
    <text x="95" y="323" font-weight="bold">SSH 터널(보드 안)</text>
    <text x="95" y="342">127.0.0.1:8080</text>
    <text x="425" y="62" font-weight="bold">nginx(워크스페이스 계정)</text>
    <text x="425" y="86">③ listen 8443 ssl: TLS 풂</text>
    <text x="425" y="108">listen 8080: 평문</text>
    <text x="425" y="130">④ 평문 + 바깥 → 308 https</text>
    <text x="425" y="152">평문 + 127.0.0.1 → 그대로</text>
    <text x="425" y="174">X-Forwarded-Proto = $scheme</text>
    <text x="425" y="196" fill="#666">화면 파일은 nginx가 바로</text>
    <text x="780" y="124" font-weight="bold">게이트웨이(C++)</text>
    <text x="780" y="146">⑤ https면 쿠키 Secure</text>
    <text x="425" y="313" font-weight="bold">&lt;데이터&gt;/config/tls/</text>
    <text x="425" y="335">workspace.crt · .key(0600)</text>
    <text x="425" y="355" fill="#666">또는 WORKSPACE_HTTPS_CERT·KEY</text>
    <text x="780" y="313" font-weight="bold">시작 셸</text>
    <text x="780" y="335">① make-cert.sh(없음·만료·주소 바뀜)</text>
    <text x="780" y="355">② render.sh → nginx.conf</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="170" y1="68" x2="298" y2="80"/>
    <line x1="170" y1="198" x2="298" y2="130"/>
    <line x1="170" y1="328" x2="298" y2="160"/>
    <line x1="550" y1="133" x2="678" y2="133"/>
    <line x1="680" y1="328" x2="552" y2="328"/>
  </g>
  <g stroke="#b04040" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#a)">
    <line x1="298" y1="140" x2="172" y2="212"/>
  </g>
  <g stroke="#b08000" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)">
    <line x1="425" y1="290" x2="425" y2="228"/>
  </g>
  <g font-size="11" fill="#444" text-anchor="middle">
    <text x="232" y="64">TLS</text>
    <text x="614" y="125">Unix 소켓</text>
    <text x="232" y="196" fill="#b04040">308</text>
    <text x="616" y="320">만듦</text>
    <text x="458" y="262" fill="#8a6500">읽음</text>
  </g>
  <text x="20" y="390" font-size="11" fill="#444">WORKSPACE_HTTPS=off(기본)이면 8443·넘김 없음 = 지금과 같음 · nginx가 없으면 게이트웨이가 TCP로 직접(HTTPS 없음)</text>
</svg>
