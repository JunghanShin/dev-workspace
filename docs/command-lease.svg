<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>명령 임대</title>
<desc>화면은 버튼을 누르는 동안 임대 명령을 lease_ms의 3분의 1마다 다시 보낸다. 명령은 게이트웨이와 mission-manager를 거쳐 워커 명령 소켓으로 간다. 워커의 호스트 루프는 계약에서 읽은 임대 표로 그 역할의 기한을 잡고, 같은 명령이나 lease.renew가 오면 기한을 늘린다. 기한이 지나면 호스트가 safe_state 명령을 모듈에 스스로 넣고 이벤트 lease_expired를 낸다. 중간 어디가 끊겨도 다시 보내기가 멈춰 기한이 지난다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

<!-- 보내는 길 -->
<rect x="20" y="60" width="150" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">화면(누르는 동안)</text>
<text x="95" y="102" text-anchor="middle" font-size="10" fill="#5F5E5A">임대 명령을 다시 보냄</text>
<text x="95" y="116" text-anchor="middle" font-size="9.5" fill="#888780">lease_ms의 1/3마다</text>
<rect x="20" y="160" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="187" text-anchor="middle" font-size="12" fill="#444441">게이트웨이</text>
<rect x="20" y="240" width="150" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="95" y="267" text-anchor="middle" font-size="12" fill="#3C3489">mission-manager</text>
<g stroke="#5F5E5A" stroke-width="1.1" fill="none">
<line x1="95" y1="124" x2="95" y2="158" marker-end="url(#a)"/>
<line x1="95" y1="204" x2="95" y2="238" marker-end="url(#a)"/>
</g>
<text x="104" y="226" font-size="9.5" fill="#534AB7">넘기기만</text>
<text x="20" y="320" font-size="10" fill="#888780">어느 곳이 끊겨도</text>
<text x="20" y="336" font-size="10" fill="#888780">(화면 · 연결 · mission)</text>
<text x="20" y="352" font-size="10" fill="#888780">다시 보내기가 멈춤 → 기한 지남</text>

<!-- 워커 -->
<rect x="210" y="40" width="560" height="420" rx="16" fill="none" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="226" y="62" font-size="13.5" font-weight="500" fill="#712B13">워커 프로세스 (libworker 호스트 + 모듈)</text>

<rect x="230" y="240" width="110" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="285" y="267" text-anchor="middle" font-size="11" fill="#712B13">명령 소켓</text>
<line x1="170" y1="262" x2="228" y2="262" stroke="#534AB7" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="370" y="90" width="230" height="300" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.4"/>
<text x="485" y="114" text-anchor="middle" font-size="13.5" font-weight="500" fill="#712B13">호스트 루프</text>
<text x="485" y="132" text-anchor="middle" font-size="10.5" fill="#993C1D">스레드 하나(상태 혼자 가짐)</text>
<g font-size="10.5" text-anchor="middle" fill="#993C1D">
<text x="485" y="164">명령 검사(허용 목록)</text>
<text x="485" y="192">임대 명령이 ok로 끝나면</text>
<text x="485" y="208">그 역할 기한 = 지금 + lease_ms</text>
<text x="485" y="236">같은 명령 · lease.renew → 기한 늘림</text>
<text x="485" y="252">safe_state 명령이 오면 → 임대 끝</text>
<text x="485" y="280">타이머(50 ms마다): 기한 지남?</text>
<text x="485" y="296">→ safe_state 명령을 스스로 넣음</text>
<text x="485" y="312">→ 이벤트 lease_expired</text>
<text x="485" y="344">get_status 공통 칸 leases</text>
</g>
<line x1="340" y1="262" x2="368" y2="262" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="250" y="90" width="100" height="100" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="300" y="112" text-anchor="middle" font-size="11" font-weight="500" fill="#444441">임대 표</text>
<text x="300" y="130" text-anchor="middle" font-size="9.5" fill="#5F5E5A">계약(내장 io)에서</text>
<text x="300" y="146" text-anchor="middle" font-size="9.5" fill="#5F5E5A">명령 → lease_ms</text>
<text x="300" y="162" text-anchor="middle" font-size="9.5" fill="#5F5E5A">역할 → safe_state</text>
<text x="300" y="178" text-anchor="middle" font-size="9" fill="#888780">시작할 때 한 번</text>
<line x1="350" y1="140" x2="368" y2="140" stroke="#5F5E5A" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#a)"/>

<rect x="630" y="170" width="120" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="690" y="196" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">모듈</text>
<text x="690" y="214" text-anchor="middle" font-size="9.5" fill="#993C1D">명령 처리(장치)</text>
<text x="690" y="228" text-anchor="middle" font-size="9.5" fill="#993C1D">임대를 모름</text>
<line x1="600" y1="205" x2="628" y2="205" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>
<text x="614" y="198" text-anchor="middle" font-size="9" fill="#993C1D">명령</text>

<rect x="630" y="300" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="690" y="322" text-anchor="middle" font-size="11" fill="#444441">발행 · heartbeat</text>
<text x="690" y="338" text-anchor="middle" font-size="9.5" fill="#5F5E5A">lease_expired 이벤트</text>
<line x1="600" y1="320" x2="628" y2="320" stroke="#993C1D" stroke-width="1.1" marker-end="url(#a)"/>

<rect x="800" y="170" width="140" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="870" y="196" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">장치</text>
<text x="870" y="214" text-anchor="middle" font-size="9.5" fill="#5F5E5A">끊겨도 정지</text>
<text x="870" y="228" text-anchor="middle" font-size="9.5" fill="#888780">(자체 안전장치는 그 아래)</text>
<line x1="750" y1="205" x2="798" y2="205" stroke="#993C1D" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>

<text x="480" y="492" text-anchor="middle" font-size="10.5" fill="#888780">계약에 lease_ms가 없는 명령(한 번에 끝나는 것)은 지금 그대로 · 단독 실행에서도 동작</text>
</svg>
