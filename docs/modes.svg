<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#fff"/>
  <g stroke="#555">
    <rect x="60" y="40" width="160" height="44" rx="6" fill="#f4f6fa"/>
    <rect x="360" y="40" width="180" height="44" rx="6" fill="#fff8e6"/>
    <rect x="60" y="140" width="320" height="50" rx="6" fill="#eaf4ea"/>
    <rect x="520" y="140" width="320" height="50" rx="6" fill="#e8eef9"/>
    <rect x="60" y="230" width="160" height="44" rx="6" fill="#f4f6fa"/>
    <rect x="360" y="230" width="180" height="44" rx="6" fill="#fff8e6"/>
    <rect x="60" y="330" width="320" height="50" rx="6" fill="#eaf4ea"/>
    <rect x="520" y="330" width="320" height="50" rx="6" fill="#e8eef9"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="140" y="67" font-weight="bold">명령(화면·외부)</text>
    <text x="450" y="60" font-weight="bold">mission 조건 검사</text>
    <text x="450" y="76" fill="#666">두 곳 같은 규칙</text>
    <text x="220" y="161" font-weight="bold">워크스페이스: 보냄</text>
    <text x="220" y="179">응답에 advisory "운용이었으면 막힘"</text>
    <text x="680" y="161" font-weight="bold">제품: 막음</text>
    <text x="680" y="179">forbidden + 이유</text>
    <text x="140" y="257" font-weight="bold">fault 단계 올라감</text>
    <text x="450" y="250" font-weight="bold">대응(do)</text>
    <text x="450" y="266" fill="#666">두 곳 같은 규칙</text>
    <text x="220" y="351" font-weight="bold">워크스페이스: 잡아 둠</text>
    <text x="220" y="369">held_actions → 화면에서 실행(fault.run_action)</text>
    <text x="680" y="351" font-weight="bold">제품: 바로 보냄</text>
    <text x="680" y="369">mission.send</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="220" y1="62" x2="358" y2="62"/>
    <line x1="430" y1="84" x2="240" y2="138"/>
    <line x1="470" y1="84" x2="660" y2="138"/>
    <line x1="220" y1="252" x2="358" y2="252"/>
    <line x1="430" y1="274" x2="240" y2="328"/>
    <line x1="470" y1="274" x2="660" y2="328"/>
  </g>
  <g font-size="11" fill="#444">
    <rect x="20" y="406" width="12" height="12" fill="#eaf4ea" stroke="#555"/>
    <text x="40" y="416">워크스페이스(늘 development, 토글 없음): 설정·시작/정지·워커 전용 명령·연결 바꾸기 됨</text>
    <rect x="20" y="426" width="12" height="12" fill="#e8eef9" stroke="#555"/>
    <text x="40" y="436">제품 묶음(늘 operation): 역할 명령·읽기만, 설정 잠금</text>
    <text x="20" y="458">우선순위·잡아 두기, 명령 임대, 받은 칸 검사, 외부 연동 워커의 mission 경유는 두 곳이 같다</text>
  </g>
