<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#fff"/>
  <g stroke="#555">
    <rect x="20" y="60" width="170" height="110" rx="6" fill="#f4f6fa"/>
    <rect x="270" y="40" width="200" height="150" rx="6" fill="#fff8e6"/>
    <rect x="560" y="40" width="150" height="60" rx="6" fill="#e8eef9"/>
    <rect x="560" y="130" width="150" height="60" rx="6" fill="#eaf4ea"/>
    <rect x="760" y="85" width="120" height="60" rx="6" fill="#f4f6fa"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="105" y="84" font-weight="bold">브라우저</text>
    <text x="105" y="106">화면 https://보드:8443</text>
    <text x="105" y="126">영상 틀 /media/siyi/</text>
    <text x="105" y="146" fill="#666" font-size="11">같은 주소 · 같은 인증서</text>
    <text x="370" y="64" font-weight="bold">nginx (보드)</text>
    <text x="370" y="90">/ · /api → 게이트웨이</text>
    <text x="370" y="114">/media/ → 127.0.0.1:8889</text>
    <text x="370" y="134" fill="#666" font-size="11">앞의 /media를 떼고 넘김</text>
    <text x="370" y="158" fill="#666" font-size="11">HTTP·HTTPS 둘 다</text>
    <text x="635" y="66" font-weight="bold">게이트웨이</text>
    <text x="635" y="86" font-size="11">/api/ui media.url</text>
    <text x="635" y="156" font-weight="bold">MediaMTX</text>
    <text x="635" y="176" font-size="11">WebRTC 8889 · WHEP</text>
    <text x="820" y="110" font-weight="bold">영상 데이터</text>
    <text x="820" y="130" font-size="11">UDP 8189</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="190" y1="100" x2="268" y2="100"/>
    <line x1="470" y1="80" x2="558" y2="70"/>
    <line x1="470" y1="130" x2="558" y2="155"/>
    <line x1="710" y1="160" x2="758" y2="125"/>
  </g>
  <path d="M760,135 C620,240 300,250 150,172" stroke="#3a7" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <g font-size="11" fill="#444">
    <text x="300" y="268" fill="#3a7">점선: WebRTC 영상은 지금처럼 브라우저와 보드가 UDP로 바로(넘기는 것은 보기 화면과 신호뿐)</text>
    <text x="20" y="290">기본 틀: nginx 뒤면 /media/{path}/, nginx 없이 게이트웨이가 직접 받으면 http://{host}:8889/{path} · WORKSPACE_UI_MEDIA_URL을 적으면 그 값</text>
  </g>
</svg>
