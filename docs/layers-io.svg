<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>워크스페이스 구성과 블록별 입출력</title>
<desc>기능 평면(매니저, 워커)과 플랫폼 평면(게이트웨이, 추상화 층, process-manager)으로 나뉜다. 화면은 게이트웨이로만 요청하고 계약과 상태를 받는다. 매니저는 추상화 층의 계약과 연결 선언을 거쳐 자기가 소유한 역할의 워커에만 명령하고 역할 주제를 받는다. 매니저끼리는 정해진 방향으로만 요청한다. 워커는 장치와 대화하고 결과를 주제, 응답, 지표, 이벤트, 데이터 버스로 내며, 명령 임대가 끊기면 안전 상태로 간다. process-manager는 매니저와 워커를 띄우고 감시하며 연결을 실체화한다. 장치 자체 제어기의 빠른 제어와 최후 안전장치는 보드와 무관하게 돈다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="900" fill="#ffffff"/>

<!-- ① 화면 -->
<rect x="40" y="20" width="440" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="260" y="42" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">① 정비 화면</text>
<text x="260" y="62" text-anchor="middle" font-size="11.5" fill="#5F5E5A">IN 계약 · 상태   OUT 요청 · 워커 정의(self)를 보고 그림</text>
<rect x="530" y="20" width="440" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="750" y="42" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">① 운용 화면 · 외부 운용</text>
<text x="750" y="62" text-anchor="middle" font-size="11.5" fill="#5F5E5A">IN 계약 · 상태   OUT 요청 · 매니저 정의를 보고 그림</text>

<!-- ② 게이트웨이 (플랫폼) -->
<rect x="40" y="124" width="930" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="505" y="146" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">② 게이트웨이 (플랫폼)</text>
<text x="505" y="166" text-anchor="middle" font-size="11.5" fill="#534AB7">IN 요청 · 매니저 상태 · 정의 파일   OUT 신분 확인 · 매니저로 전달 · 상태 중계 · 계약 제공 · 명령 기록 · 운용/개발 모드</text>

<!-- ③ 매니저 층 (기능) -->
<rect x="40" y="220" width="720" height="170" rx="14" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="56" y="241" font-size="14" font-weight="500" fill="#085041">③ 매니저 층 (기능: 판단 · 관리만, 장치 모름)</text>
<text x="744" y="241" text-anchor="end" font-size="11" fill="#0F6E56">IN 역할 주제 · 요청   OUT 역할 명령 · 매니저 주제</text>
<rect x="55" y="255" width="98" height="105" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="104" y="277" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">config</text>
<text x="104" y="298" text-anchor="middle" font-size="10.5" fill="#0F6E56">IN 설정 요청</text>
<text x="104" y="315" text-anchor="middle" font-size="10.5" fill="#0F6E56">OUT 프리셋 적용</text>
<text x="104" y="332" text-anchor="middle" font-size="10.5" fill="#0F6E56">권한 · 버전 · 백업</text>
<rect x="173" y="255" width="98" height="105" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="222" y="277" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">record</text>
<text x="222" y="298" text-anchor="middle" font-size="10.5" fill="#0F6E56">IN 주제 · 이벤트</text>
<text x="222" y="315" text-anchor="middle" font-size="10.5" fill="#0F6E56">데이터 버스</text>
<text x="222" y="332" text-anchor="middle" font-size="10.5" fill="#0F6E56">OUT 검색 · 내보내기</text>
<rect x="291" y="255" width="98" height="105" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="340" y="277" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">status</text>
<text x="340" y="298" text-anchor="middle" font-size="10.5" fill="#0F6E56">IN 모든 역할 주제</text>
<text x="340" y="315" text-anchor="middle" font-size="10.5" fill="#0F6E56">OUT 종합 상태</text>
<text x="340" y="332" text-anchor="middle" font-size="10.5" fill="#0F6E56">명령 안 함</text>
<rect x="409" y="255" width="98" height="105" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="458" y="277" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">fault</text>
<text x="458" y="298" text-anchor="middle" font-size="10.5" fill="#0F6E56">IN 종합 상태</text>
<text x="458" y="315" text-anchor="middle" font-size="10.5" fill="#0F6E56">이벤트</text>
<text x="458" y="332" text-anchor="middle" font-size="10.5" fill="#0F6E56">OUT 비상 요청</text>
<rect x="527" y="255" width="98" height="105" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="576" y="277" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">mission</text>
<text x="576" y="298" text-anchor="middle" font-size="10.5" fill="#0F6E56">IN 화면·외부 명령 · 비상 요청</text>
<text x="576" y="315" text-anchor="middle" font-size="10.5" fill="#0F6E56">OUT 역할 명령</text>
<text x="576" y="332" text-anchor="middle" font-size="10.5" fill="#0F6E56">명령 정리 · 모드 허가</text>
<rect x="645" y="255" width="98" height="105" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="694" y="277" text-anchor="middle" font-size="11.5" font-weight="500" fill="#085041">payload</text>
<text x="694" y="298" text-anchor="middle" font-size="10.5" fill="#0F6E56">IN 모듈 운용 요청</text>
<text x="694" y="315" text-anchor="middle" font-size="10.5" fill="#0F6E56">OUT 장비 명령</text>
<text x="694" y="332" text-anchor="middle" font-size="10.5" fill="#0F6E56">추적 고리 켜고 끔</text>
<text x="400" y="378" text-anchor="middle" font-size="10.5" fill="#0F6E56">매니저 간 요청은 화살표 방향으로만(역방향 금지) · 상태는 모든 매니저가 status에서 구독</text>

<!-- ④ 추상화 층 (플랫폼) -->
<rect x="40" y="430" width="720" height="92" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="56" y="450" font-size="14" font-weight="500" fill="#3C3489">④ 추상화 층 (플랫폼: 파일과 규칙)</text>
<rect x="55" y="460" width="220" height="50" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="0.8"/>
<text x="165" y="480" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">계약: 정의 파일</text>
<text x="165" y="498" text-anchor="middle" font-size="10.5" fill="#534AB7">공통(이벤트 · 시각) · 역할 · self</text>
<rect x="290" y="460" width="220" height="50" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="0.8"/>
<text x="400" y="480" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">연결 선언 · 명령 소유</text>
<text x="400" y="498" text-anchor="middle" font-size="10.5" fill="#534AB7">누가 무엇을 씀 · 역할마다 명령은 하나</text>
<rect x="525" y="460" width="220" height="50" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="0.8"/>
<text x="635" y="480" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">출력 대조 점검</text>
<text x="635" y="498" text-anchor="middle" font-size="10.5" fill="#534AB7">실제 출력 = 정의(개발 때)</text>

<!-- ⑤ 워커 층 (기능) -->
<rect x="40" y="562" width="720" height="196" rx="14" fill="none" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="56" y="583" font-size="14" font-weight="500" fill="#712B13">⑤ 장치 · 처리 워커 (기능: 맡은 일만, 결과만 냄)</text>
<text x="744" y="583" text-anchor="end" font-size="11" fill="#993C1D">IN 명령 · 설정 · 장치 데이터   OUT 주제 · 응답 · 지표 · 이벤트</text>
<rect x="55" y="596" width="150" height="78" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="130" y="619" text-anchor="middle" font-size="12.5" font-weight="500" fill="#712B13">제어기 워커</text>
<text x="130" y="638" text-anchor="middle" font-size="10.5" fill="#993C1D">역할 control</text>
<text x="130" y="656" text-anchor="middle" font-size="10.5" fill="#993C1D">명령 소유: mission</text>
<rect x="235" y="596" width="150" height="78" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="310" y="619" text-anchor="middle" font-size="12.5" font-weight="500" fill="#712B13">카메라 · 센서 워커</text>
<text x="310" y="638" text-anchor="middle" font-size="10.5" fill="#993C1D">역할 camera · sensor</text>
<text x="310" y="656" text-anchor="middle" font-size="10.5" fill="#993C1D">명령 소유: payload</text>
<rect x="415" y="596" width="150" height="78" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="490" y="619" text-anchor="middle" font-size="12.5" font-weight="500" fill="#712B13">영상 인식 워커</text>
<text x="490" y="638" text-anchor="middle" font-size="10.5" fill="#993C1D">역할 detection</text>
<text x="490" y="656" text-anchor="middle" font-size="10.5" fill="#993C1D">명령 소유: payload</text>
<rect x="595" y="596" width="150" height="78" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="670" y="619" text-anchor="middle" font-size="12.5" font-weight="500" fill="#712B13">그 밖의 워커</text>
<text x="670" y="638" text-anchor="middle" font-size="10.5" fill="#993C1D">센서 · 통신 · 보드 상태</text>
<text x="670" y="656" text-anchor="middle" font-size="10.5" fill="#993C1D">소유 매니저 하나</text>
<text x="400" y="692" text-anchor="middle" font-size="10.5" fill="#993C1D">명령 임대가 끊기면 안전 상태 · 이벤트는 공통 형식 · 모든 주제에 공통 시각(t_mono_ns)</text>
<rect x="55" y="704" width="690" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="400" y="726" text-anchor="middle" font-size="11.5" fill="#0C447C">데이터 버스: 큰 데이터(프레임 · 원시 레코드). 정의의 data 칸으로만, 쓰는 쪽은 연결 선언으로</text>

<!-- ⑥ 장치 -->
<rect x="40" y="792" width="720" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="400" y="812" text-anchor="middle" font-size="12.5" fill="#444441">⑥ 장치: 제어기 · 카메라 · 구동기 · 센서 · 통신 장비</text>
<text x="400" y="831" text-anchor="middle" font-size="11" fill="#5F5E5A">장치 자체 제어기의 빠른 제어와 최후 안전장치(전원 · 통신 끊김 대응)는 보드와 무관하게 돈다</text>

<!-- process-manager (플랫폼) -->
<rect x="790" y="220" width="180" height="538" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="880" y="246" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">process-manager</text>
<text x="880" y="264" text-anchor="middle" font-size="11" fill="#534AB7">(플랫폼: 실행 · 감시)</text>
<text x="805" y="298" font-size="11" font-weight="500" fill="#3C3489">IN</text>
<text x="805" y="316" font-size="10.5" fill="#534AB7">· heartbeat · 지표</text>
<text x="805" y="333" font-size="10.5" fill="#534AB7">· 연결 선언 · 정의</text>
<text x="805" y="350" font-size="10.5" fill="#534AB7">· 설정(프리셋)</text>
<text x="805" y="367" font-size="10.5" fill="#534AB7">· 시작 · 정지 요청</text>
<text x="805" y="400" font-size="11" font-weight="500" fill="#3C3489">OUT</text>
<text x="805" y="418" font-size="10.5" fill="#534AB7">· 프로세스 실행 · 감시</text>
<text x="805" y="435" font-size="10.5" fill="#534AB7">· 재실행</text>
<text x="805" y="452" font-size="10.5" fill="#534AB7">· 입력 주소 넣어 줌</text>
<text x="805" y="469" font-size="10.5" fill="#534AB7">· 버전 · 명령 소유 검사</text>
<text x="805" y="486" font-size="10.5" fill="#534AB7">· 소켓 접근 허용 목록</text>
<text x="805" y="503" font-size="10.5" fill="#534AB7">· 프로세스 상태</text>
<text x="805" y="536" font-size="11" font-weight="500" fill="#3C3489">하지 않음</text>
<text x="805" y="554" font-size="10.5" fill="#534AB7">· 기능 판단</text>
<text x="805" y="571" font-size="10.5" fill="#534AB7">· 데이터 중계</text>

<!-- 화살표: 위층 ↔ 아래층 -->
<g fill="none" stroke="#444441" stroke-width="1.2">
<line x1="220" y1="84" x2="220" y2="124" marker-end="url(#a)"/>
<line x1="300" y1="124" x2="300" y2="84" marker-end="url(#a)"/>
<line x1="710" y1="84" x2="710" y2="124" marker-end="url(#a)"/>
<line x1="790" y1="124" x2="790" y2="84" marker-end="url(#a)"/>
<line x1="300" y1="180" x2="300" y2="220" marker-end="url(#a)"/>
<line x1="480" y1="220" x2="480" y2="180" marker-end="url(#a)"/>
<line x1="300" y1="390" x2="300" y2="430" marker-end="url(#a)"/>
<line x1="480" y1="430" x2="480" y2="390" marker-end="url(#a)"/>
<line x1="300" y1="522" x2="300" y2="562" marker-end="url(#a)"/>
<line x1="480" y1="562" x2="480" y2="522" marker-end="url(#a)"/>
<line x1="400" y1="758" x2="400" y2="792" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
<g font-size="11" fill="#5F5E5A">
<text x="212" y="108" text-anchor="end">요청</text><text x="308" y="108">계약 · 상태</text>
<text x="702" y="108" text-anchor="end">요청</text><text x="798" y="108">계약 · 상태</text>
<text x="292" y="204" text-anchor="end">요청</text><text x="488" y="204">매니저 상태</text>
<text x="292" y="414" text-anchor="end">역할 명령(소유한 것만)</text><text x="488" y="414">역할 주제 구독</text>
<text x="292" y="546" text-anchor="end">명령 + 임대</text><text x="488" y="546">주제 · 응답 · 이벤트</text>
</g>
<!-- 매니저 간 방향 -->
<g fill="none" stroke="#0F6E56" stroke-width="1.2">
<line x1="389" y1="307" x2="409" y2="307" marker-end="url(#a)"/>
<line x1="507" y1="307" x2="527" y2="307" marker-end="url(#a)"/>
<line x1="625" y1="307" x2="645" y2="307" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
<!-- process-manager 연결 -->
<g fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="4 3">
<line x1="880" y1="180" x2="880" y2="220" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="790" y1="300" x2="760" y2="300" marker-end="url(#a)"/>
<line x1="760" y1="476" x2="790" y2="476" marker-end="url(#a)"/>
<line x1="790" y1="640" x2="760" y2="640" marker-end="url(#a)"/>
</g>
<!-- 빠른 제어 고리 -->
<line x1="415" y1="630" x2="385" y2="630" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>

<!-- 범례 -->
<g font-size="11" fill="#444441">
<rect x="40" y="862" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="60" y="873">플랫폼(실행 · 연결 · 출입)</text>
<rect x="210" y="862" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="230" y="873">기능: 매니저</text>
<rect x="320" y="862" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="340" y="873">기능: 워커</text>
<line x1="420" y1="869" x2="446" y2="869" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="452" y="873">실행 · 감시 · 연결 주입</text>
<line x1="600" y1="869" x2="626" y2="869" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="632" y="873">빠른 제어 고리(payload가 켬): 인식 → 구동기</text>
</g>
</svg>
