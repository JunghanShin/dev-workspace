<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>예제 워커 실행 구조 (템플릿)</title>
<desc>example-worker 프로세스 안의 호스트 루프, 입력 단계 source.gen, 발행 스레드 source.pub, 다른 워커를 받는 peer.data·peer.sub·peer.cmd 스레드, 자식 프로세스 helper, 바깥과의 명령·데이터·상태 흐름</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="720" height="640" fill="#ffffff"/>

<rect x="175" y="30" width="370" height="370" rx="16" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="195" y="54" font-size="14" font-weight="500" fill="#2C2C2A">example-worker 프로세스</text>

<rect x="195" y="70" width="150" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="270" y="93" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">source.gen</text>
<text x="270" y="113" text-anchor="middle" font-size="12" fill="#534AB7">입력 단계: 값 생성</text>

<rect x="375" y="70" width="150" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="450" y="93" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">source.pub</text>
<text x="450" y="113" text-anchor="middle" font-size="12" fill="#534AB7">발행: 상태 내보냄</text>

<rect x="195" y="155" width="330" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="360" y="177" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">호스트 루프 스레드</text>
<text x="360" y="196" text-anchor="middle" font-size="12" fill="#534AB7">상태를 혼자 가짐, 기다리지 않음</text>
<text x="213" y="220" font-size="12" fill="#3C3489">source — 값 받아 데이터 버스에 씀</text>
<text x="213" y="238" font-size="12" fill="#3C3489">processor — 이동 평균(포트로 받음)</text>
<text x="213" y="256" font-size="12" fill="#3C3489">peer — 받은 것 처리, 명령 넘김</text>

<rect x="192" y="285" width="336" height="98" rx="10" fill="none" stroke="#7F77DD" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="205" y="302" font-size="12" fill="#534AB7">peer 모듈 (다른 워커 받기)</text>
<rect x="202" y="312" width="100" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="252" y="334" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">peer.data</text>
<text x="252" y="354" text-anchor="middle" font-size="12" fill="#534AB7">데이터 받기</text>
<rect x="310" y="312" width="100" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="360" y="334" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">peer.sub</text>
<text x="360" y="354" text-anchor="middle" font-size="12" fill="#534AB7">상태 구독</text>
<rect x="418" y="312" width="100" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="468" y="334" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">peer.cmd</text>
<text x="468" y="354" text-anchor="middle" font-size="12" fill="#534AB7">명령 보내기</text>

<rect x="175" y="425" width="370" height="90" rx="16" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="195" y="446" font-size="12" fill="#444441">자식 프로세스 (워커와 별도, 죽으면 2 s 뒤 다시)</text>
<rect x="285" y="455" width="150" height="48" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="360" y="475" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">helper</text>
<text x="360" y="493" text-anchor="middle" font-size="12" fill="#0F6E56">설정 helper_cmd</text>

<rect x="20" y="70" width="135" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="87" y="93" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">장치 자리</text>
<text x="87" y="113" text-anchor="middle" font-size="12" fill="#5F5E5A">예제는 값을 만들어 냄</text>

<rect x="20" y="180" width="135" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="87" y="203" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">화면·다른 워커</text>
<text x="87" y="223" text-anchor="middle" font-size="12" fill="#5F5E5A">명령 보냄</text>

<rect x="20" y="305" width="135" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="87" y="328" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">상대 예제 워커</text>
<text x="87" y="347" text-anchor="middle" font-size="12" fill="#5F5E5A">데이터 버스·상태</text>
<text x="87" y="364" text-anchor="middle" font-size="12" fill="#5F5E5A">·명령 소켓</text>

<rect x="570" y="70" width="135" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="637" y="93" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">구독자</text>
<text x="637" y="113" text-anchor="middle" font-size="12" fill="#5F5E5A">상태 받는 곳</text>

<rect x="570" y="180" width="135" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="637" y="203" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">데이터 버스</text>
<text x="637" y="223" text-anchor="middle" font-size="12" fill="#5F5E5A">받는 다른 워커</text>

<line x1="157" y1="99" x2="192" y2="99" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="270" y1="130" x2="270" y2="152" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a)"/>
<text x="278" y="146" font-size="12" fill="#5F5E5A">큐</text>
<line x1="450" y1="153" x2="450" y2="131" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
<text x="458" y="146" font-size="12" fill="#5F5E5A">큐</text>
<line x1="527" y1="99" x2="567" y2="99" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="157" y1="209" x2="192" y2="209" stroke="#7F77DD" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="527" y1="209" x2="567" y2="209" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="157" y1="341" x2="189" y2="341" stroke="#1D9E75" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="490" y1="309" x2="490" y2="268" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a)"/>
<text x="498" y="282" font-size="12" fill="#5F5E5A">큐</text>
<path d="M195 252 L184 252 L184 479 L282 479" fill="none" stroke="#888780" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="192" y="417" font-size="12" fill="#5F5E5A">감시</text>

<rect x="30" y="545" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="52" y="557" font-size="12" fill="#444441">스레드 (워커 프로세스 안)</text>
<rect x="245" y="545" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="267" y="557" font-size="12" fill="#444441">자식 프로세스</text>
<rect x="400" y="545" width="14" height="14" rx="3" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="422" y="557" font-size="12" fill="#444441">프로세스 경계</text>
<line x1="30" y1="590" x2="60" y2="590" stroke="#7F77DD" stroke-width="1.6"/>
<text x="68" y="594" font-size="12" fill="#444441">명령·응답</text>
<line x1="245" y1="590" x2="275" y2="590" stroke="#1D9E75" stroke-width="1.6"/>
<text x="283" y="594" font-size="12" fill="#444441">데이터(값·데이터 버스)</text>
<line x1="450" y1="590" x2="480" y2="590" stroke="#888780" stroke-width="1.6"/>
<text x="488" y="594" font-size="12" fill="#444441">상태 발행, 점선은 감시</text>
</svg>
