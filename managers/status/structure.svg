<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>status-manager 구조</title>
<desc>status-manager는 프로세스 하나다. process-manager 구독(워커 상태·heartbeat 지표)과 워커마다 스트림 구독(역할 주제)을 스레드와 큐로 받는다. 코어 스레드 하나가 규칙으로 워커마다 건강·링크를 정하고 시스템 상태 하나로 합친다. 결과는 주제 system으로 발행하고, 건강이 바뀌면 이벤트를 낸다. 다른 매니저·게이트웨이·record-manager가 구독한다. 명령은 읽기(get_system)만</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

<!-- 보내는 곳 -->
<rect x="20" y="80" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="101" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">process-manager</text>
<text x="95" y="119" text-anchor="middle" font-size="10" fill="#5F5E5A">워커 상태 · heartbeat 지표</text>
<rect x="20" y="170" width="150" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="95" y="191" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">워커 · 매니저들</text>
<text x="95" y="209" text-anchor="middle" font-size="10" fill="#993C1D">역할 주제 · 이벤트(many)</text>
<rect x="20" y="300" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="321" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">요청 보낸 곳</text>
<text x="95" y="339" text-anchor="middle" font-size="10" fill="#5F5E5A">화면 · 다른 매니저</text>

<!-- 프로세스 -->
<rect x="190" y="30" width="560" height="380" rx="16" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="206" y="52" font-size="13.5" font-weight="500" fill="#3C3489">status-manager (C++, libworker 호스트 + 모듈 status)</text>

<g font-size="11" text-anchor="middle">
<rect x="210" y="85" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="109" fill="#3C3489">pm 구독</text>
<rect x="210" y="175" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="199" fill="#3C3489">구독 × 워커 수</text>
<rect x="210" y="305" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="329" fill="#3C3489">명령 소켓</text>
</g>
<g font-size="10.5" text-anchor="middle" fill="#5F5E5A">
<rect x="345" y="93" width="50" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="370" y="109">큐</text>
<rect x="345" y="183" width="50" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="370" y="199">큐</text>
</g>
<g stroke-width="1.1" fill="none">
<line x1="170" y1="105" x2="208" y2="105" stroke="#5F5E5A" marker-end="url(#a)"/>
<line x1="170" y1="195" x2="208" y2="195" stroke="#993C1D" marker-end="url(#a)"/>
<line x1="170" y1="325" x2="208" y2="325" stroke="#5F5E5A" marker-start="url(#a)" marker-end="url(#a)"/>
<g stroke="#534AB7">
<line x1="330" y1="105" x2="343" y2="105" marker-end="url(#a)"/>
<line x1="330" y1="195" x2="343" y2="195" marker-end="url(#a)"/>
<line x1="395" y1="105" x2="428" y2="105" marker-end="url(#a)"/>
<line x1="395" y1="195" x2="428" y2="195" marker-end="url(#a)"/>
<line x1="330" y1="325" x2="428" y2="325" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
</g>
<text x="380" y="317" text-anchor="middle" font-size="10" fill="#534AB7">get_system · 답</text>

<!-- 코어 -->
<rect x="430" y="80" width="190" height="300" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="525" y="106" text-anchor="middle" font-size="13.5" font-weight="500" fill="#3C3489">코어</text>
<text x="525" y="125" text-anchor="middle" font-size="10.5" fill="#534AB7">스레드 하나(호스트 루프)</text>
<g font-size="11" text-anchor="middle" fill="#534AB7">
<text x="525" y="160">워커마다 건강 판정</text>
<text x="525" y="176">(상태 · heartbeat · 링크 지표)</text>
<text x="525" y="202">시스템 건강 하나로 합침</text>
<text x="525" y="218">(필수 워커 규칙)</text>
<text x="525" y="244">링크 모음 · 시각 기준</text>
<text x="525" y="270">바뀌면 이벤트</text>
<text x="525" y="300">규칙 = 매니저 설정(데이터)</text>
</g>

<!-- 출력 -->
<rect x="650" y="110" width="86" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="693" y="129" text-anchor="middle" font-size="11.5" fill="#3C3489">발행</text>
<text x="693" y="145" text-anchor="middle" font-size="9.5" fill="#534AB7">주제 system</text>
<line x1="620" y1="132" x2="648" y2="132" stroke="#534AB7" stroke-width="1.1" marker-end="url(#a)"/>

<rect x="780" y="80" width="160" height="104" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="860" y="104" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">구독자</text>
<g font-size="10" text-anchor="middle" fill="#5F5E5A">
<text x="860" y="124">다른 매니저 전부</text>
<text x="860" y="140">게이트웨이(화면)</text>
<text x="860" y="156">record-manager(기록)</text>
</g>
<line x1="736" y1="132" x2="778" y2="132" stroke="#5F5E5A" stroke-width="1.1" marker-end="url(#a)"/>

<text x="470" y="440" text-anchor="middle" font-size="10.5" fill="#888780">명령은 읽기만(시스템 상태 바꾸지 않음, 누구에게도 명령하지 않음) · 모든 스레드 ThreadWatch · 큐는 크기 제한</text>
</svg>
