<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="320" fill="#fff"/>
  <g stroke="#555">
    <rect x="20" y="40" width="200" height="56" rx="6" fill="#f4f6fa"/>
    <rect x="20" y="130" width="200" height="56" rx="6" fill="#f4f6fa"/>
    <rect x="290" y="70" width="210" height="96" rx="6" fill="#fff8e6"/>
    <rect x="570" y="70" width="140" height="96" rx="6" fill="#e8eef9"/>
    <rect x="760" y="40" width="120" height="156" rx="6" fill="#fde8e8"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="120" y="63" font-weight="bold">워커 상태(process-manager)</text>
    <text x="120" y="83">바뀌면 바로</text>
    <text x="120" y="153" font-weight="bold">주제(워커·매니저 스트림)</text>
    <text x="120" y="173">규칙 간격마다 하나</text>
    <text x="395" y="94" font-weight="bold">솎기</text>
    <text x="395" y="116">워커: 실행 중 5 s · 멈춤 60 s</text>
    <text x="395" y="136">관리 주제(status·payload) 5 s</text>
    <text x="395" y="156">그 밖 주제 1 s</text>
    <text x="640" y="104" font-weight="bold">기록 파일</text>
    <text x="640" y="126">64 MB마다 새 파일</text>
    <text x="640" y="146">records/*.jsonl</text>
    <text x="820" y="66" font-weight="bold">지우기</text>
    <text x="820" y="90">오래된 것부터</text>
    <text x="820" y="114">전체 8 GB 넘음</text>
    <text x="820" y="134">14일 지남</text>
    <text x="820" y="154">빈 곳 4 GB 아래</text>
    <text x="820" y="182" fill="#666" font-size="11">새 파일 · 10분마다</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="220" y1="68" x2="288" y2="100"/>
    <line x1="220" y1="158" x2="288" y2="136"/>
    <line x1="500" y1="118" x2="568" y2="118"/>
    <line x1="710" y1="118" x2="758" y2="118"/>
  </g>
  <g font-size="11" fill="#444">
    <text x="20" y="236">보드 실측(2026-11-25): 하루 약 1.5 GB, 상한 2 GB라 약 32시간치. 70%가 워커 상태 줄(11개 × 1 s, 꺼진 워커도), 9%가 status 요약 주제</text>
    <text x="20" y="256">바꾼 뒤 예상: 하루 약 0.4~0.5 GB → 14일 약 6~7 GB. 이벤트·명령·시스템 줄은 그대로 모두 남김</text>
    <text x="20" y="276">지금 쓰는 파일은 지우지 않음 · 디스크가 작은 보드는 빈 곳 기준이 먼저 지움</text>
  </g>
</svg>
