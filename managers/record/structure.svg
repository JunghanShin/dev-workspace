<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>record-manager 구조</title>
<desc>record-manager는 프로세스 하나다. process-manager 구독(워커 상태·시스템·명령)과 워커마다 구독(주제·이벤트)을 스레드와 큐로 받는다. 코어 스레드 하나가 규칙으로 거르고 솎아 기록 줄을 만들어 쓰기 큐에 넣고, 쓰기 스레드가 기록 파일에 쓴다. 찾기 요청은 명령 소켓으로 받아 찾기 스레드가 파일을 읽고 결과를 코어로 돌려준다. 게이트웨이 /history는 지금처럼 파일을 직접 읽는다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

<!-- 보내는 곳 -->
<rect x="20" y="80" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="101" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">process-manager</text>
<text x="95" y="119" text-anchor="middle" font-size="10" fill="#5F5E5A">워커 상태 · 시스템 · 명령</text>
<rect x="20" y="160" width="150" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="95" y="181" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">워커들</text>
<text x="95" y="199" text-anchor="middle" font-size="10" fill="#993C1D">주제 · 이벤트(many)</text>
<rect x="20" y="240" width="150" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="95" y="261" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">다른 매니저</text>
<text x="95" y="279" text-anchor="middle" font-size="10" fill="#534AB7">매니저 주제 · 이벤트</text>
<rect x="20" y="325" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="346" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">요청 보낸 곳</text>
<text x="95" y="364" text-anchor="middle" font-size="10" fill="#5F5E5A">화면(게이트웨이) 등</text>

<!-- 프로세스 -->
<rect x="190" y="30" width="600" height="400" rx="16" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="206" y="52" font-size="13.5" font-weight="500" fill="#3C3489">record-manager (C++, libworker 호스트 + 모듈 record)</text>

<g font-size="11" text-anchor="middle">
<rect x="210" y="85" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="109" fill="#3C3489">pm 구독</text>
<rect x="210" y="165" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="189" fill="#3C3489">구독 × 워커 수</text>
<rect x="210" y="245" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="269" fill="#3C3489">구독 × 매니저 수</text>
<rect x="210" y="330" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="354" fill="#3C3489">명령 소켓</text>
</g>
<g font-size="10.5" text-anchor="middle" fill="#5F5E5A">
<rect x="345" y="93" width="50" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="370" y="109">큐</text>
<rect x="345" y="173" width="50" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="370" y="189">큐</text>
<rect x="345" y="253" width="50" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="370" y="269">큐</text>
</g>

<g stroke-width="1.1" fill="none">
<line x1="170" y1="105" x2="208" y2="105" stroke="#5F5E5A" marker-end="url(#a)"/>
<line x1="170" y1="185" x2="208" y2="185" stroke="#993C1D" marker-end="url(#a)"/>
<line x1="170" y1="265" x2="208" y2="265" stroke="#534AB7" marker-end="url(#a)"/>
<line x1="170" y1="350" x2="208" y2="350" stroke="#5F5E5A" marker-start="url(#a)" marker-end="url(#a)"/>
<g stroke="#534AB7">
<line x1="330" y1="105" x2="343" y2="105" marker-end="url(#a)"/>
<line x1="330" y1="185" x2="343" y2="185" marker-end="url(#a)"/>
<line x1="330" y1="265" x2="343" y2="265" marker-end="url(#a)"/>
<line x1="395" y1="105" x2="428" y2="105" marker-end="url(#a)"/>
<line x1="395" y1="185" x2="428" y2="185" marker-end="url(#a)"/>
<line x1="395" y1="265" x2="428" y2="265" marker-end="url(#a)"/>
<line x1="330" y1="350" x2="428" y2="350" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
</g>
<text x="380" y="342" text-anchor="middle" font-size="10" fill="#534AB7">찾기 요청 · 답</text>

<!-- 코어 -->
<rect x="430" y="80" width="170" height="300" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="515" y="106" text-anchor="middle" font-size="13.5" font-weight="500" fill="#3C3489">코어</text>
<text x="515" y="125" text-anchor="middle" font-size="10.5" fill="#534AB7">스레드 하나(호스트 루프)</text>
<g font-size="11" text-anchor="middle" fill="#534AB7">
<text x="515" y="160">거르기: 규칙에 맞는 주제만</text>
<text x="515" y="182">솎기: (보낸 곳, 주제)마다</text>
<text x="515" y="198">정한 간격으로 하나</text>
<text x="515" y="220">이벤트 · 명령은 모두</text>
<text x="515" y="242">줄 만들기(t, t_mono_ns,</text>
<text x="515" y="258">kind, src)</text>
<text x="515" y="292">지표: 줄 · 버림 · 바이트</text>
</g>

<!-- 쓰기 / 찾기 -->
<g font-size="10.5" text-anchor="middle" fill="#5F5E5A">
<rect x="615" y="128" width="58" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="644" y="144">쓰기 큐</text>
<rect x="615" y="318" width="58" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="644" y="334">찾기 큐</text>
</g>
<g font-size="11" text-anchor="middle">
<rect x="682" y="120" width="92" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="728" y="144" fill="#3C3489">쓰기 스레드</text>
<rect x="682" y="310" width="92" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="728" y="334" fill="#3C3489">찾기 스레드</text>
</g>
<g font-size="10" text-anchor="middle" fill="#888780">
<text x="690" y="180">줄마다 flush · 5 s fsync</text>
<text x="690" y="196">파일 나누기 · 오래된 것 지우기</text>
<text x="690" y="212">차면 버리고 지표로</text>
</g>
<g stroke="#534AB7" stroke-width="1.1" fill="none">
<line x1="600" y1="140" x2="613" y2="140" marker-end="url(#a)"/>
<line x1="673" y1="140" x2="680" y2="140" marker-end="url(#a)"/>
<line x1="600" y1="330" x2="613" y2="330" marker-end="url(#a)"/>
<line x1="673" y1="330" x2="680" y2="330" marker-end="url(#a)"/>
<polyline points="728,350 728,405 515,405 515,382" marker-end="url(#a)"/>
</g>
<text x="622" y="399" text-anchor="middle" font-size="10" fill="#534AB7">찾은 결과</text>

<!-- 파일 -->
<rect x="815" y="100" width="130" height="270" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="880" y="128" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">기록 파일</text>
<g font-size="10" text-anchor="middle" fill="#5F5E5A">
<text x="880" y="150">&lt;데이터&gt;/records/</text>
<text x="880" y="166">{시작}_{boot}.jsonl</text>
<text x="880" y="196">한 줄 = 기록 하나</text>
<text x="880" y="212">지금 logger와 같은 곳</text>
<text x="880" y="228">· 같은 형식 + 새 종류</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.1" fill="none">
<line x1="774" y1="140" x2="813" y2="140" marker-end="url(#a)"/>
<line x1="815" y1="330" x2="776" y2="330" marker-end="url(#a)"/>
<line x1="880" y1="370" x2="880" y2="438" stroke-dasharray="4 3" marker-end="url(#a)"/>
</g>
<rect x="800" y="440" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="875" y="459" text-anchor="middle" font-size="11.5" fill="#444441">게이트웨이 /history</text>
<text x="875" y="475" text-anchor="middle" font-size="9.5" fill="#5F5E5A">지금처럼 파일을 읽음</text>
</svg>
