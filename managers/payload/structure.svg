<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>payload-manager 구조</title>
<desc>payload-manager는 프로세스 하나다. process-manager 구독(워커 상태)과 계약 읽기(역할), status-manager 주제 system(건강)을 받아 모듈 목록을 만든다. 모듈은 매니저가 아닌 워커다. 명령 power·power_group은 mission-manager를 거쳐 오고, 코어가 process-manager 쓰기 소켓으로 시작·정지를 요청한다(운용 모드에서도 시작·정지만 됨). 결과는 주제 payload로 낸다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

<!-- 왼쪽 -->
<rect x="20" y="70" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="91" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">process-manager</text>
<text x="95" y="109" text-anchor="middle" font-size="10" fill="#5F5E5A">워커 상태 · 계약(get_io)</text>
<rect x="20" y="170" width="150" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="95" y="191" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">status-manager</text>
<text x="95" y="209" text-anchor="middle" font-size="10" fill="#534AB7">주제 system(건강)</text>
<rect x="20" y="300" width="150" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="95" y="321" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">mission-manager</text>
<text x="95" y="339" text-anchor="middle" font-size="10" fill="#534AB7">payload.power 등 넘김</text>

<!-- 프로세스 -->
<rect x="190" y="40" width="570" height="400" rx="16" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="206" y="62" font-size="13.5" font-weight="500" fill="#3C3489">payload-manager (C++, libworker 호스트 + 모듈 payload)</text>

<g font-size="11" text-anchor="middle">
<rect x="210" y="75" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="99" fill="#3C3489">pm 구독 · 계약</text>
<rect x="210" y="175" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="199" fill="#3C3489">system 구독</text>
<rect x="210" y="305" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="329" fill="#3C3489">명령 소켓</text>
</g>
<g font-size="10.5" text-anchor="middle" fill="#5F5E5A">
<rect x="345" y="83" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="367" y="99">큐</text>
<rect x="345" y="183" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="367" y="199">큐</text>
</g>
<g stroke-width="1.1" fill="none">
<line x1="170" y1="95" x2="208" y2="95" stroke="#5F5E5A" marker-end="url(#a)"/>
<line x1="170" y1="195" x2="208" y2="195" stroke="#534AB7" marker-end="url(#a)"/>
<line x1="170" y1="325" x2="208" y2="325" stroke="#534AB7" marker-start="url(#a)" marker-end="url(#a)"/>
<g stroke="#534AB7">
<line x1="330" y1="95" x2="343" y2="95" marker-end="url(#a)"/>
<line x1="330" y1="195" x2="343" y2="195" marker-end="url(#a)"/>
<line x1="389" y1="95" x2="418" y2="95" marker-end="url(#a)"/>
<line x1="389" y1="195" x2="418" y2="195" marker-end="url(#a)"/>
<line x1="330" y1="325" x2="418" y2="325" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
</g>
<text x="374" y="317" text-anchor="middle" font-size="9.5" fill="#534AB7">요청 · 답</text>

<!-- 코어 -->
<rect x="420" y="75" width="180" height="300" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="510" y="100" text-anchor="middle" font-size="13.5" font-weight="500" fill="#3C3489">코어</text>
<text x="510" y="118" text-anchor="middle" font-size="10.5" fill="#534AB7">스레드 하나(호스트 루프)</text>
<g font-size="10.5" text-anchor="middle" fill="#534AB7">
<text x="510" y="150">모듈 목록</text>
<text x="510" y="166">(매니저가 아닌 워커)</text>
<text x="510" y="182">역할 · 상태 · 건강</text>
<text x="510" y="212">묶음(규칙 groups)</text>
<text x="510" y="242">켜고 끄기 요청</text>
<text x="510" y="258">(매니저는 못 건드림)</text>
<text x="510" y="288">요청 결과는 상태로 확인</text>
</g>

<!-- 쓰기 -->
<rect x="620" y="235" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="642" y="251" text-anchor="middle" font-size="10" fill="#5F5E5A">요청 큐</text>
<rect x="672" y="227" width="78" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="711" y="244" text-anchor="middle" font-size="10.5" fill="#3C3489">pm 쓰기</text>
<text x="711" y="259" text-anchor="middle" font-size="9" fill="#534AB7">스레드</text>
<line x1="600" y1="247" x2="618" y2="247" stroke="#534AB7" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="664" y1="247" x2="670" y2="247" stroke="#534AB7" stroke-width="1.1" marker-end="url(#a)"/>

<rect x="790" y="210" width="150" height="74" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="865" y="232" text-anchor="middle" font-size="11.5" font-weight="500" fill="#444441">process-manager</text>
<text x="865" y="250" text-anchor="middle" font-size="9.5" fill="#5F5E5A">쓰기 소켓 manager-payload…</text>
<text x="865" y="266" text-anchor="middle" font-size="9.5" fill="#5F5E5A">운용 모드: start · stop만</text>
<line x1="750" y1="247" x2="788" y2="247" stroke="#5F5E5A" stroke-width="1.1" marker-start="url(#a)" marker-end="url(#a)"/>

<!-- 발행 -->
<rect x="620" y="320" width="90" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="665" y="337" text-anchor="middle" font-size="11" fill="#3C3489">발행</text>
<text x="665" y="352" text-anchor="middle" font-size="9.5" fill="#534AB7">주제 payload</text>
<line x1="600" y1="340" x2="618" y2="340" stroke="#534AB7" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="710" y1="340" x2="788" y2="340" stroke="#5F5E5A" stroke-width="1.1" marker-end="url(#a)"/>
<rect x="790" y="315" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="865" y="336" text-anchor="middle" font-size="11" fill="#444441">구독자</text>
<text x="865" y="353" text-anchor="middle" font-size="9.5" fill="#5F5E5A">record · 화면 · mission</text>

<text x="475" y="472" text-anchor="middle" font-size="10.5" fill="#888780">빠른 제어 고리 켜고 끄기 · mission과 협조(명령에 필요한 모듈 켜기)는 다음 판</text>
</svg>
