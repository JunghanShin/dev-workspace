<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>config-manager 구조</title>
<desc>config-manager는 프로세스 하나다. process-manager 구독(워커 상태·설정 버전)과 실행 파일 BUILD 파일, 데이터 폴더 설정 파일을 읽는다. 코어가 소프트웨어 버전 목록과 설정 묶음(스냅숏)을 만든다. 스냅숏은 자기 폴더에 파일로 쓰고, 되돌리기는 process-manager 쓰기 소켓으로 워커 설정·연결 선언을 다시 넣는다(개발 모드에서만). 결과는 주제 config로 낸다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

<!-- 왼쪽 -->
<rect x="20" y="70" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="91" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">process-manager</text>
<text x="95" y="109" text-anchor="middle" font-size="10" fill="#5F5E5A">워커 상태 · 설정 버전</text>
<rect x="20" y="160" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="181" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">파일(읽기만)</text>
<text x="95" y="198" text-anchor="middle" font-size="10" fill="#5F5E5A">bin/BUILD · 데이터 config/</text>
<text x="95" y="210" text-anchor="middle" font-size="9.5" fill="#888780">profile.json</text>
<rect x="20" y="300" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="321" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">요청 보낸 곳</text>
<text x="95" y="339" text-anchor="middle" font-size="10" fill="#5F5E5A">화면(mission 거쳐)</text>

<!-- 프로세스 -->
<rect x="190" y="40" width="570" height="410" rx="16" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="206" y="62" font-size="13.5" font-weight="500" fill="#3C3489">config-manager (C++, libworker 호스트 + 모듈 config)</text>

<g font-size="11" text-anchor="middle">
<rect x="210" y="75" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="99" fill="#3C3489">pm 구독</text>
<rect x="210" y="168" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="186" fill="#3C3489">읽기 · 쓰기</text><text x="270" y="200" font-size="9.5" fill="#534AB7">스레드(파일 · pm)</text>
<rect x="210" y="305" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="329" fill="#3C3489">명령 소켓</text>
</g>
<rect x="345" y="83" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="367" y="99" text-anchor="middle" font-size="10.5" fill="#5F5E5A">큐</text>
<rect x="345" y="176" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="367" y="192" text-anchor="middle" font-size="10.5" fill="#5F5E5A">큐</text>
<g stroke-width="1.1" fill="none">
<line x1="170" y1="95" x2="208" y2="95" stroke="#5F5E5A" marker-end="url(#a)"/>
<line x1="170" y1="188" x2="208" y2="188" stroke="#5F5E5A" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="170" y1="325" x2="208" y2="325" stroke="#5F5E5A" marker-start="url(#a)" marker-end="url(#a)"/>
<g stroke="#534AB7">
<line x1="330" y1="95" x2="343" y2="95" marker-end="url(#a)"/>
<line x1="389" y1="95" x2="418" y2="95" marker-end="url(#a)"/>
<line x1="330" y1="188" x2="343" y2="188" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="389" y1="188" x2="418" y2="188" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="330" y1="325" x2="418" y2="325" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
</g>
<text x="374" y="317" text-anchor="middle" font-size="9.5" fill="#534AB7">요청 · 답</text>

<!-- 코어 -->
<rect x="420" y="75" width="180" height="330" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="510" y="100" text-anchor="middle" font-size="13.5" font-weight="500" fill="#3C3489">코어</text>
<text x="510" y="118" text-anchor="middle" font-size="10.5" fill="#534AB7">스레드 하나(호스트 루프)</text>
<g font-size="10.5" text-anchor="middle" fill="#534AB7">
<text x="510" y="150">소프트웨어 버전 목록</text>
<text x="510" y="166">(BUILD · libworker · 어긋남)</text>
<text x="510" y="196">설정 묶음(스냅숏)</text>
<text x="510" y="212">워커 설정 · 연결 선언 ·</text>
<text x="510" y="228">데이터 config 파일</text>
<text x="510" y="258">지금과 비교(diff)</text>
<text x="510" y="288">되돌리기: 워커 설정 ·</text>
<text x="510" y="304">연결 선언만(개발 모드)</text>
<text x="510" y="334">시작할 때 바뀌었으면</text>
<text x="510" y="350">자동 스냅숏, 20개 남김</text>
</g>

<!-- 출력 -->
<rect x="620" y="170" width="140" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="690" y="187" text-anchor="middle" font-size="10.5" fill="#444441">config/snapshots/</text>
<text x="690" y="201" text-anchor="middle" font-size="9.5" fill="#5F5E5A">&lt;시각&gt;.json(자기 파일만)</text>
<line x1="600" y1="190" x2="618" y2="190" stroke="#5F5E5A" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#a)"/>

<rect x="20" y="228" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="249" text-anchor="middle" font-size="11.5" font-weight="500" fill="#444441">process-manager</text>
<text x="95" y="265" text-anchor="middle" font-size="9.5" fill="#5F5E5A">쓰기 소켓(manager_api)</text>
<text x="95" y="279" text-anchor="middle" font-size="9.5" fill="#5F5E5A">set_config · set_connections</text>
<polyline points="250,208 250,258 172,258" fill="none" stroke="#5F5E5A" stroke-width="1.1" marker-end="url(#a)"/>
<text x="256" y="248" font-size="9" fill="#5F5E5A">되돌리기</text>
<text x="256" y="260" font-size="9" fill="#5F5E5A">(개발 모드)</text>

<rect x="620" y="320" width="90" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="665" y="337" text-anchor="middle" font-size="11" fill="#3C3489">발행</text>
<text x="665" y="352" text-anchor="middle" font-size="9.5" fill="#534AB7">주제 config</text>
<line x1="600" y1="340" x2="618" y2="340" stroke="#534AB7" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="710" y1="340" x2="788" y2="340" stroke="#5F5E5A" stroke-width="1.1" marker-end="url(#a)"/>
<rect x="790" y="315" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="865" y="336" text-anchor="middle" font-size="11" fill="#444441">구독자</text>
<text x="865" y="353" text-anchor="middle" font-size="9.5" fill="#5F5E5A">record · 화면</text>

<text x="475" y="478" text-anchor="middle" font-size="10.5" fill="#888780">워크스페이스 설정 파일(망·포트)은 읽고 비교만, 쓰지 않음(설계 6.12) · 사용자 · 권한 · 키는 지금처럼 게이트웨이</text>
</svg>
