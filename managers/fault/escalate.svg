<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#fff"/>
  <g stroke="#555">
    <rect x="20" y="40" width="160" height="90" rx="6" fill="#f4f6fa"/>
    <rect x="230" y="30" width="260" height="110" rx="6" fill="#e8eef9"/>
    <rect x="540" y="55" width="130" height="60" rx="6" fill="#f4f6fa"/>
    <rect x="220" y="200" width="190" height="74" rx="6" fill="#fff8e6"/>
    <rect x="450" y="200" width="190" height="74" rx="6" fill="#ffefd9"/>
    <rect x="680" y="200" width="190" height="74" rx="6" fill="#ffe0d9"/>
    <rect x="450" y="310" width="190" height="44" rx="6" fill="#eaf4ea"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="100" y="62" font-weight="bold">입력</text>
    <text x="100" y="82">status 건강 · 시스템</text>
    <text x="100" y="100">heartbeat 지표</text>
    <text x="100" y="118">워커 이벤트</text>
    <text x="360" y="52" font-weight="bold">조건 when</text>
    <text x="360" y="74">all / any (중첩 4단까지)</text>
    <text x="360" y="94">잎: health · metric · event · system</text>
    <text x="360" y="114">조합은 시스템 전체로 한 번 판정</text>
    <text x="360" y="132" fill="#666">status 없으면 모름 → 그대로 둠</text>
    <text x="605" y="80" font-weight="bold">for_s</text>
    <text x="605" y="100">이만큼 이어지면</text>
    <text x="315" y="222" font-weight="bold">올림 · 단계 0</text>
    <text x="315" y="242">규칙 severity, fault_raised</text>
    <text x="315" y="262">do 한 번 → mission.send</text>
    <text x="545" y="222" font-weight="bold">단계 1 (after_s)</text>
    <text x="545" y="242">심각도 올림, fault_escalated</text>
    <text x="545" y="262">그 단계 do 한 번</text>
    <text x="775" y="222" font-weight="bold">단계 n</text>
    <text x="775" y="242">예: critical</text>
    <text x="775" y="262">그 단계 do 한 번</text>
    <text x="545" y="330" font-weight="bold">내림 · fault_cleared</text>
    <text x="545" y="346">어느 단계에서든 조건이 풀리면</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="180" y1="85" x2="228" y2="85"/>
    <line x1="490" y1="85" x2="538" y2="85"/>
    <path d="M605,115 L605,165 L315,165 L315,198"/>
    <line x1="410" y1="237" x2="448" y2="237"/>
    <line x1="640" y1="237" x2="678" y2="237"/>
  </g>
  <g stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#a)">
    <path d="M315,274 L315,332 L448,332"/>
    <line x1="545" y1="274" x2="545" y2="308"/>
    <path d="M775,274 L775,332 L642,332"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#444">
    <text x="429" y="229">after_s</text>
    <text x="659" y="229">after_s</text>
    <text x="460" y="158">참</text>
  </g>
  <g font-size="11" fill="#444">
    <text x="20" y="380">예전 형식(조건 하나, stages 없음)은 지금과 같음 · 같은 단계 대응은 되풀이하지 않음 · 개발 모드는 대응을 잡아 둠(fault.run_action)</text>
  </g>
</svg>
