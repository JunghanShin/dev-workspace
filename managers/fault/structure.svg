<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>fault-manager 구조</title>
<desc>fault-manager는 프로세스 하나다. status-manager 주제 system(건강), 워커·매니저 스트림의 이벤트(many), process-manager의 워커 지표를 받는다. 코어가 규칙(조건, 지속 시간, 심각도, 대응)으로 이상을 올리고 내린다. 대응은 mission-manager에 mission.send로 요청한다(운용 모드. 개발 모드에서는 잡아 두고 fault.run_action으로). 이상 목록은 주제 fault, 올림·내림은 이벤트로 낸다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

<!-- 왼쪽 -->
<rect x="20" y="70" width="150" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="95" y="91" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">status-manager</text>
<text x="95" y="109" text-anchor="middle" font-size="10" fill="#534AB7">주제 system(건강)</text>
<rect x="20" y="160" width="150" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="95" y="181" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">워커 · 매니저들</text>
<text x="95" y="199" text-anchor="middle" font-size="10" fill="#993C1D">이벤트(many)</text>
<rect x="20" y="250" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="271" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">process-manager</text>
<text x="95" y="289" text-anchor="middle" font-size="10" fill="#5F5E5A">워커 지표 · 운용 모드</text>
<rect x="20" y="355" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="376" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">요청 보낸 곳</text>
<text x="95" y="394" text-anchor="middle" font-size="10" fill="#5F5E5A">화면(목록 · 확인)</text>

<!-- 프로세스 -->
<rect x="190" y="40" width="570" height="410" rx="16" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="206" y="62" font-size="13.5" font-weight="500" fill="#3C3489">fault-manager (C++, libworker 호스트 + 모듈 fault)</text>

<g font-size="11" text-anchor="middle">
<rect x="210" y="75" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="99" fill="#3C3489">system 구독</text>
<rect x="210" y="165" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="189" fill="#3C3489">구독 × 워커 수</text>
<rect x="210" y="255" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="279" fill="#3C3489">pm 구독</text>
<rect x="210" y="360" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270" y="384" fill="#3C3489">명령 소켓</text>
</g>
<g font-size="10.5" text-anchor="middle" fill="#5F5E5A">
<rect x="345" y="83" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="367" y="99">큐</text>
<rect x="345" y="173" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="367" y="189">큐</text>
<rect x="345" y="263" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="367" y="279">큐</text>
</g>
<g stroke-width="1.1" fill="none">
<line x1="170" y1="95" x2="208" y2="95" stroke="#534AB7" marker-end="url(#a)"/>
<line x1="170" y1="185" x2="208" y2="185" stroke="#993C1D" marker-end="url(#a)"/>
<line x1="170" y1="275" x2="208" y2="275" stroke="#5F5E5A" marker-end="url(#a)"/>
<line x1="170" y1="380" x2="208" y2="380" stroke="#5F5E5A" marker-start="url(#a)" marker-end="url(#a)"/>
<g stroke="#534AB7">
<line x1="330" y1="95" x2="343" y2="95" marker-end="url(#a)"/>
<line x1="330" y1="185" x2="343" y2="185" marker-end="url(#a)"/>
<line x1="330" y1="275" x2="343" y2="275" marker-end="url(#a)"/>
<line x1="389" y1="95" x2="418" y2="95" marker-end="url(#a)"/>
<line x1="389" y1="185" x2="418" y2="185" marker-end="url(#a)"/>
<line x1="389" y1="275" x2="418" y2="275" marker-end="url(#a)"/>
<line x1="330" y1="380" x2="418" y2="380" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
</g>
<text x="374" y="372" text-anchor="middle" font-size="9.5" fill="#534AB7">list · ack</text>

<!-- 코어 -->
<rect x="420" y="75" width="180" height="340" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="510" y="100" text-anchor="middle" font-size="13.5" font-weight="500" fill="#3C3489">코어</text>
<text x="510" y="118" text-anchor="middle" font-size="10.5" fill="#534AB7">스레드 하나(호스트 루프)</text>
<g font-size="10.5" text-anchor="middle" fill="#534AB7">
<text x="510" y="150">규칙마다 조건 보기</text>
<text x="510" y="166">(건강 · 이벤트 · 지표)</text>
<text x="510" y="192">조건이 for_s 넘게 이어지면</text>
<text x="510" y="208">이상 올림(심각도)</text>
<text x="510" y="234">조건이 풀리면 내림</text>
<text x="510" y="260">올릴 때 대응 한 번</text>
<text x="510" y="276">(운용: 바로 · 개발: 잡아 둠)</text>
<text x="510" y="302">이상 목록 · 확인(ack)</text>
<text x="510" y="336">규칙 = 매니저 설정(데이터)</text>
<text x="510" y="352">기본 규칙 없음</text>
</g>

<!-- 대응 -->
<rect x="620" y="155" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="642" y="171" text-anchor="middle" font-size="10" fill="#5F5E5A">요청 큐</text>
<rect x="672" y="147" width="78" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="711" y="164" text-anchor="middle" font-size="10.5" fill="#3C3489">명령 스레드</text>
<text x="711" y="179" text-anchor="middle" font-size="9" fill="#534AB7">CommandClient</text>
<line x1="600" y1="167" x2="618" y2="167" stroke="#534AB7" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="664" y1="167" x2="670" y2="167" stroke="#534AB7" stroke-width="1.1" marker-end="url(#a)"/>
<rect x="790" y="135" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="865" y="158" text-anchor="middle" font-size="11.5" font-weight="500" fill="#3C3489">mission-manager</text>
<text x="865" y="176" text-anchor="middle" font-size="9.5" fill="#534AB7">mission.send(비상 대응)</text>
<text x="865" y="190" text-anchor="middle" font-size="9.5" fill="#534AB7">origin: fault-manager</text>
<line x1="750" y1="167" x2="788" y2="167" stroke="#534AB7" stroke-width="1.1" marker-start="url(#a)" marker-end="url(#a)"/>

<!-- 발행 -->
<rect x="620" y="300" width="90" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="665" y="317" text-anchor="middle" font-size="11" fill="#3C3489">발행</text>
<text x="665" y="332" text-anchor="middle" font-size="9.5" fill="#534AB7">주제 fault · 이벤트</text>
<line x1="600" y1="320" x2="618" y2="320" stroke="#534AB7" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="710" y1="320" x2="788" y2="320" stroke="#5F5E5A" stroke-width="1.1" marker-end="url(#a)"/>
<rect x="790" y="295" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="865" y="316" text-anchor="middle" font-size="11" fill="#444441">구독자</text>
<text x="865" y="333" text-anchor="middle" font-size="9.5" fill="#5F5E5A">record · 화면 · 다른 매니저</text>

<text x="475" y="478" text-anchor="middle" font-size="10.5" fill="#888780">요청 방향은 fault → mission뿐(원칙 13) · 워커에 직접 명령하지 않음 · 다른 매니저가 죽어도 이상 판단은 돎</text>
</svg>
