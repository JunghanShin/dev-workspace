<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>mission-manager 구조</title>
<desc>게이트웨이는 읽기 명령은 워커로 바로, 그 밖의 워커 명령은 mission-manager의 명령 소켓으로 mission.send를 보낸다. mission-manager 코어는 (대상 워커, 역할)마다 대기 큐를 두고 한 번에 하나씩 그 워커로 보낸다. 큐마다 명령 스레드 하나(libworker CommandClient)가 워커 명령 소켓으로 보내고 응답을 응답 큐로 돌려준다. 코어는 응답을 게이트웨이에 돌려준다. 큐가 차면 busy, 기다림이 길면 timeout. process-manager 구독으로 운용 모드와 계약(명령의 역할)을 안다. 주제 mission으로 큐 상태를 낸다</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

<!-- 왼쪽 -->
<rect x="20" y="70" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="93" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">게이트웨이</text>
<text x="95" y="112" text-anchor="middle" font-size="10" fill="#5F5E5A">화면 · 원격(from)</text>
<rect x="20" y="200" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="221" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">process-manager</text>
<text x="95" y="239" text-anchor="middle" font-size="10" fill="#5F5E5A">워커 상태 · 모드 · 계약</text>

<!-- 읽기 명령 바로 -->
<polyline points="95,70 95,40 870,40 870,98" fill="none" stroke="#5F5E5A" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="480" y="33" text-anchor="middle" font-size="10.5" fill="#5F5E5A">읽기 명령(get_status, "read": true)은 지금처럼 워커로 바로</text>

<!-- 프로세스 -->
<rect x="200" y="60" width="580" height="400" rx="16" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="216" y="82" font-size="13.5" font-weight="500" fill="#3C3489">mission-manager (C++, libworker 호스트 + 모듈 mission)</text>

<g font-size="11" text-anchor="middle">
<rect x="220" y="100" width="110" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="275" y="124" fill="#3C3489">명령 소켓</text>
<rect x="220" y="205" width="110" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="275" y="229" fill="#3C3489">pm 구독</text>
</g>
<rect x="345" y="213" width="44" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="367" y="229" text-anchor="middle" font-size="10.5" fill="#5F5E5A">큐</text>
<g stroke-width="1.1" fill="none">
<line x1="170" y1="120" x2="218" y2="120" stroke="#5F5E5A" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="170" y1="225" x2="218" y2="225" stroke="#5F5E5A" marker-end="url(#a)"/>
<g stroke="#534AB7">
<line x1="330" y1="120" x2="398" y2="120" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="330" y1="225" x2="343" y2="225" marker-end="url(#a)"/>
<line x1="389" y1="225" x2="398" y2="225" marker-end="url(#a)"/>
</g>
</g>
<text x="176" y="140" font-size="9.5" fill="#5F5E5A">mission.send</text>
<text x="364" y="112" text-anchor="middle" font-size="9.5" fill="#534AB7">요청 · 답</text>

<!-- 코어 -->
<rect x="400" y="95" width="170" height="270" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="485" y="120" text-anchor="middle" font-size="13.5" font-weight="500" fill="#3C3489">코어</text>
<text x="485" y="138" text-anchor="middle" font-size="10.5" fill="#534AB7">스레드 하나(호스트 루프)</text>
<g font-size="10.5" text-anchor="middle" fill="#534AB7">
<text x="485" y="168">명령 → (대상, 역할) 찾기</text>
<text x="485" y="184">(계약으로)</text>
<text x="485" y="210">(대상, 역할)마다 대기 큐</text>
<text x="485" y="226">한 번에 하나, 응답 오면 다음</text>
<text x="485" y="252">큐가 차면 busy</text>
<text x="485" y="268">오래 기다리면 timeout</text>
<text x="485" y="294">응답을 보낸 곳에 돌려줌</text>
<text x="485" y="320">from · origin 남김</text>
</g>

<!-- 큐들 -->
<g font-size="9.5" text-anchor="middle" fill="#5F5E5A">
<rect x="590" y="120" width="70" height="30" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="625" y="133">cam1 · mount</text><text x="625" y="145">■■□□</text>
<rect x="590" y="175" width="70" height="30" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="625" y="188">cam1 · camera</text><text x="625" y="200">■□□□</text>
<rect x="590" y="230" width="70" height="30" rx="4" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8"/><text x="625" y="243">loc · control</text><text x="625" y="255">□□□□</text>
</g>
<g font-size="10" text-anchor="middle">
<rect x="680" y="120" width="82" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="721" y="139" fill="#3C3489">명령 스레드</text>
<rect x="680" y="175" width="82" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="721" y="194" fill="#3C3489">명령 스레드</text>
<rect x="680" y="230" width="82" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="721" y="249" fill="#3C3489">명령 스레드</text>
</g>
<g stroke="#534AB7" stroke-width="1.1" fill="none">
<line x1="570" y1="135" x2="588" y2="135" marker-end="url(#a)"/>
<line x1="570" y1="190" x2="588" y2="190" marker-end="url(#a)"/>
<line x1="570" y1="245" x2="588" y2="245" marker-end="url(#a)"/>
<line x1="660" y1="135" x2="678" y2="135" marker-end="url(#a)"/>
<line x1="660" y1="190" x2="678" y2="190" marker-end="url(#a)"/>
<line x1="660" y1="245" x2="678" y2="245" marker-end="url(#a)"/>
<polyline points="721,260 721,290 572,290" marker-end="url(#a)"/>
</g>
<text x="646" y="284" text-anchor="middle" font-size="9.5" fill="#534AB7">응답(응답 큐)</text>
<text x="675" y="110" text-anchor="middle" font-size="9.5" fill="#888780">(대상, 역할)마다 큐 + CommandClient</text>

<!-- 발행 -->
<rect x="590" y="330" width="90" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="635" y="347" text-anchor="middle" font-size="11" fill="#3C3489">발행</text>
<text x="635" y="362" text-anchor="middle" font-size="9.5" fill="#534AB7">주제 mission</text>
<line x1="570" y1="350" x2="588" y2="350" stroke="#534AB7" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="680" y1="350" x2="808" y2="350" stroke="#5F5E5A" stroke-width="1.1" marker-end="url(#a)"/>
<rect x="810" y="325" width="130" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="875" y="346" text-anchor="middle" font-size="11" fill="#444441">구독자</text>
<text x="875" y="363" text-anchor="middle" font-size="9.5" fill="#5F5E5A">record · status · 화면</text>

<!-- 워커들 -->
<rect x="810" y="100" width="130" height="170" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="875" y="124" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">워커 명령 소켓</text>
<g font-size="10" text-anchor="middle" fill="#993C1D">
<text x="875" y="150">from: mission-manager</text>
<text x="875" y="166">origin: screen 등</text>
<text x="875" y="192">허용 목록에 늘 있음</text>
<text x="875" y="208">(게이트웨이처럼)</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.1" fill="none">
<line x1="762" y1="135" x2="808" y2="135" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="762" y1="190" x2="808" y2="190" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="762" y1="245" x2="808" y2="245" marker-start="url(#a)" marker-end="url(#a)"/>
</g>

<text x="480" y="492" text-anchor="middle" font-size="10.5" fill="#888780">mission이 설치돼 있는데 떠 있지 않으면 게이트웨이는 503 unavailable(우회하지 않음) · 설치되지 않았으면 지금처럼 워커로 바로</text>
</svg>
