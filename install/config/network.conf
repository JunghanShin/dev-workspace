# 보드 네트워크 설정(고정 IP). 기본은 사용 안 함(보드의 기존 네트워크 설정 그대로).
# workspace-start.sh가 시작할 때마다 읽어 적용한다(<데이터>/config/network.conf). 코드에 IP를 두지 않는다.
# 현장 값은 프로필(install/profiles/<이름>, 설치할 때 선택)이나 데이터 폴더의 사본에서 넣는다.
# 바꿀 때는 이 파일만 고치고 ./workspace-start.sh(실행 중이면 멈추고 다시 시작) 또는 재부팅.
# SSH는 sshd 기본(22)을 그대로 쓴다. 외부 포트 변환은 보드 밖(라우터·서버)에서 한다.
#
# 주의: 원격(SSH) 접속 중인 인터페이스의 주소를 바꾸면 접속이 끊긴다.
#       새 주소로 다시 접속한다. 안 되면 콘솔에서 ENABLED=no로 되돌린다.

# yes일 때만 IP를 적용한다
ENABLED=no

# 인터페이스 이름 (ip link 로 확인). 예: enP8p1s0
IFACE=

# 고정 주소(CIDR). 여러 개면 공백으로 구분. 예: "192.168.1.100/24"
ADDRESSES=

# 다른 망으로 나가는 게이트웨이(라우터 LAN 주소). 비워 두면 설정하지 않는다
GATEWAY=

# 비워 두면 설정하지 않는다
DNS=
