# 워크스페이스 MAVLink 라우터 설정 (mavlink-router 5e38c7a 문법). docs/fc-mavlink-router.md 참고.
# 현장 값은 데이터 폴더의 사본(<데이터>/config/mavlink-router.conf)에서 바꾼다. 이 파일은 기본값이다.
# 처음 설치할 때 install_mavlink_router.sh가 사본을 만들고, FC가 응답한 포트로 Device·Baud를 채운다.
# 바꾼 뒤: sudo systemctl restart workspace-mavlink-router
#
# '#'으로 시작하는 줄은 주석. 줄 끝 주석은 쓸 수 없다.

[General]
# TCP 서버 끔. 로컬·LTE 구간 모두 UDP를 쓴다
TcpServerPort = 0
# 출구별 수신·송신 통계를 1초마다 journal에 남긴다(연결 확인용)
ReportStats = true
MavlinkDialect = common

# FC. Holybro Pixhawk Jetson Baseboard는 FC TELEM2가 보드 안에서 /dev/ttyTHS1에 연결되어 있다.
# Baud는 FC의 SER_TEL2_BAUD와 같아야 한다. FC는 MAV_1_FLOW_CTRL = Force off여야 한다
[UartEndpoint flight_controller]
Device = /dev/ttyTHS1
Baud = 921600

# 원격 서버(지상 GCS 등). 현장 값이라 기본은 없음. 쓰려면 아래 네 줄의 # 를 지우고 주소를 넣는다(프로필에 두면 편함)
#[UdpEndpoint server]
#Mode = Normal
#Address = <원격 서버 주소>
#Port = 14540

# Jetson 안의 워크스페이스 프로그램. udpin:127.0.0.1:14551 로 받는다. 이 포트는 한 프로그램만 연다
[UdpEndpoint local_workspace]
Mode = Normal
Address = 127.0.0.1
Port = 14551
